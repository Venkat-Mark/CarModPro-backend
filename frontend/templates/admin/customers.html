<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Management - CarModPro Admin</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/admin.css">
</head>
<body class="admin-page">
<div class="admin-wrapper">
    <div th:replace="~{fragments/layout :: adminSidebar('customers')}"></div>
    <div class="admin-main">
        <div th:replace="~{fragments/layout :: adminTopbar('Customer Accounts')}"></div>
        <div class="admin-content p-4">
            <div th:replace="~{fragments/navbar :: alerts}"></div>

            <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
                <div>
                    <h4 class="text-white mb-0">Registered Customers</h4>
                    <p class="text-muted small mb-0">View customer accounts, vehicle history, and manage access</p>
                </div>
            </div>

            <!-- Search Card -->
            <div class="content-card mb-4">
                <div class="content-card-body">
                    <form th:action="@{/admin/customers}" method="get" class="row g-3 align-items-center">
                        <div class="col-md-9">
                            <div class="input-group">
                                <span class="input-group-text bg-transparent border-secondary text-muted">
                                    <i class="bi bi-search"></i>
                                </span>
                                <input type="text" class="form-control" name="search"
                                       th:value="${searchQuery}"
                                       placeholder="Search customers by name, email, or phone number...">
                            </div>
                        </div>
                        <div class="col-md-3 d-flex gap-2">
                            <button type="submit" class="btn btn-warning w-100">Search</button>
                            <a th:if="${searchQuery}" th:href="@{/admin/customers}" class="btn btn-outline-secondary">Clear</a>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Table -->
            <div class="content-card">
                <div class="content-card-header d-flex justify-content-between align-items-center">
                    <h6 class="text-white mb-0">
                        <i class="bi bi-people-fill me-2 text-warning"></i>Customer List
                        <span class="badge bg-secondary ms-2" th:text="${customers.totalElements}"></span>
                    </h6>
                </div>
                <div class="content-card-body">
                    <div th:if="${customers.isEmpty()}" class="empty-state py-5 text-center">
                        <i class="bi bi-people fs-1 text-muted"></i>
                        <p class="text-muted mt-2">No customers found.</p>
                    </div>

                    <div th:if="${!customers.isEmpty()}" class="table-responsive">
                        <table class="table data-table">
                            <thead>
                                <tr>
                                    <th>#ID</th>
                                    <th>Name</th>
                                    <th>Email</th>
                                    <th>Phone</th>
                                    <th>Vehicles</th>
                                    <th>Status</th>
                                    <th>Joined</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="c : ${customers.content}">
                                    <td class="text-warning fw-semibold" th:text="${'#' + c.id}"></td>
                                    <td class="text-white fw-semibold small" th:text="${c.fullName}"></td>
                                    <td class="text-muted small" th:text="${c.email}"></td>
                                    <td class="text-white small" th:text="${c.phone ?: '—'}"></td>
                                    <td>
                                        <span class="badge bg-dark border border-secondary"
                                              th:text="${#lists.size(c.vehicles)} + ' cars'"></span>
                                    </td>
                                    <td>
                                        <span class="badge"
                                              th:classappend="${c.status.name() == 'ACTIVE'} ? 'bg-success' : 'bg-danger'"
                                              th:text="${c.status}">
                                        </span>
                                    </td>
                                    <td class="text-muted small" th:text="${#temporals.format(c.createdAt, 'dd MMM yyyy')}"></td>
                                    <td>
                                        <div class="d-flex gap-2">
                                            <a th:href="@{/admin/customers/{id}(id=${c.id})}"
                                               class="btn btn-sm btn-outline-warning" title="View Profile & Orders">
                                                <i class="bi bi-eye"></i> Details
                                            </a>
                                            <form th:action="@{/admin/customers/{id}/toggle-status(id=${c.id})}" method="post"
                                                  class="d-inline" onsubmit="return confirm('Change customer account status?');">
                                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                                <button type="submit" class="btn btn-sm"
                                                        th:classappend="${c.status.name() == 'ACTIVE'} ? 'btn-outline-danger' : 'btn-outline-success'"
                                                        th:title="${c.status.name() == 'ACTIVE'} ? 'Suspend Account' : 'Activate Account'">
                                                    <i class="bi" th:classappend="${c.status.name() == 'ACTIVE'} ? 'bi-slash-circle' : 'bi-check-circle'"></i>
                                                </button>
                                            </form>
                                        </div>
                                    </td>
                                </tr>
                            </tbody>
                        </table>

                        <!-- Pagination -->
                        <nav th:if="${totalPages > 1}" class="mt-3">
                            <ul class="pagination justify-content-center">
                                <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                                    <a class="page-link" th:href="@{/admin/customers(page=${currentPage-1},search=${searchQuery})}">
                                        <i class="bi bi-chevron-left"></i>
                                    </a>
                                </li>
                                <li th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
                                    class="page-item" th:classappend="${i == currentPage} ? 'active'">
                                    <a class="page-link" th:href="@{/admin/customers(page=${i},search=${searchQuery})}"
                                       th:text="${i + 1}"></a>
                                </li>
                                <li class="page-item" th:classappend="${currentPage == totalPages - 1} ? 'disabled'">
                                    <a class="page-link" th:href="@{/admin/customers(page=${currentPage+1},search=${searchQuery})}">
                                        <i class="bi bi-chevron-right"></i>
                                    </a>
                                </li>
                            </ul>
                        </nav>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/admin.js"></script>
</body>
</html>
