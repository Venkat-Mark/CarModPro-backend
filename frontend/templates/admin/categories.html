<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Categories - CarModPro Admin</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/admin.css">
</head>
<body class="admin-page">
<div class="admin-wrapper">
    <div th:replace="~{fragments/layout :: adminSidebar('categories')}"></div>
    <div class="admin-main">
        <div th:replace="~{fragments/layout :: adminTopbar('Modification Categories')}"></div>
        <div class="admin-content p-4">
            <div th:replace="~{fragments/navbar :: alerts}"></div>

            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h4 class="text-white mb-0">Modification Categories</h4>
                    <p class="text-muted small mb-0">Organize modification services into catalog groups</p>
                </div>
            </div>

            <div class="row g-4">
                <!-- Left: Create / Edit Category Form -->
                <div class="col-lg-4">
                    <div class="content-card">
                        <div class="content-card-header">
                            <h6 class="text-white mb-0">
                                <i class="bi bi-folder-plus me-2 text-warning"></i>
                                <span th:text="${editMode} ? 'Edit Category' : 'Add New Category'">Add Category</span>
                            </h6>
                        </div>
                        <div class="content-card-body p-4">
                            <form th:action="@{/admin/categories/save}" method="post" th:object="${newCategory}">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                <input type="hidden" th:field="*{id}"/>

                                <div class="mb-3">
                                    <label class="form-label text-muted small fw-semibold">CATEGORY NAME *</label>
                                    <input type="text" class="form-control" th:field="*{name}"
                                           th:class="${#fields.hasErrors('name')} ? 'form-control is-invalid' : 'form-control'"
                                           placeholder="e.g. Performance Tuning" required>
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label text-muted small fw-semibold">BOOTSTRAP ICON CLASS</label>
                                    <input type="text" class="form-control" th:field="*{iconClass}"
                                           placeholder="e.g. bi-speedometer2">
                                    <small class="text-muted" style="font-size:11px">Use any Bootstrap 5 icon class name</small>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label text-muted small fw-semibold">DESCRIPTION</label>
                                    <textarea class="form-control" th:field="*{description}" rows="3"
                                              placeholder="Summary of modifications in this category..."></textarea>
                                </div>

                                <div class="mb-3 form-check form-switch">
                                    <input class="form-check-input" type="checkbox" role="switch" id="catActiveSwitch" th:field="*{active}">
                                    <label class="form-check-label text-white" for="catActiveSwitch">Active in Catalog</label>
                                </div>

                                <div class="d-flex gap-2">
                                    <button type="submit" class="btn btn-warning w-100 fw-semibold">
                                        <i class="bi bi-check-lg me-1"></i>
                                        <span th:text="${editMode} ? 'Update Category' : 'Save Category'">Save</span>
                                    </button>
                                    <a th:if="${editMode}" th:href="@{/admin/categories}" class="btn btn-outline-secondary">Cancel</a>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>

                <!-- Right: Categories List Table -->
                <div class="col-lg-8">
                    <div class="content-card">
                        <div class="content-card-header d-flex justify-content-between align-items-center">
                            <h6 class="text-white mb-0"><i class="bi bi-grid-3x3-gap-fill me-2 text-warning"></i>Existing Categories</h6>
                            <span class="badge bg-secondary" th:text="${#lists.size(categories)} + ' categories'"></span>
                        </div>
                        <div class="content-card-body">
                            <div th:if="${#lists.isEmpty(categories)}" class="empty-state py-5 text-center">
                                <i class="bi bi-folder-x fs-1 text-muted"></i>
                                <p class="text-muted mt-2">No categories defined.</p>
                            </div>

                            <div th:if="${!#lists.isEmpty(categories)}" class="table-responsive">
                                <table class="table data-table">
                                    <thead>
                                        <tr>
                                            <th>Icon</th>
                                            <th>Name</th>
                                            <th>Description</th>
                                            <th>Services</th>
                                            <th>Status</th>
                                            <th>Actions</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr th:each="cat : ${categories}">
                                            <td>
                                                <i th:class="${'bi ' + (cat.iconClass ?: 'bi-folder') + ' text-warning fs-5'}"></i>
                                            </td>
                                            <td class="text-white fw-semibold small" th:text="${cat.name}"></td>
                                            <td class="text-muted small" th:text="${#strings.abbreviate(cat.description ?: '', 45)}"></td>
                                            <td>
                                                <span class="badge bg-dark border border-secondary"
                                                      th:text="${#lists.size(cat.services)} + ' items'"></span>
                                            </td>
                                            <td>
                                                <form th:action="@{/admin/categories/{id}/toggle(id=${cat.id})}" method="post" class="d-inline">
                                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                                    <button type="submit" class="btn btn-sm"
                                                            th:classappend="${cat.active} ? 'btn-outline-success' : 'btn-outline-secondary'">
                                                        <span th:text="${cat.active} ? 'Active' : 'Disabled'"></span>
                                                    </button>
                                                </form>
                                            </td>
                                            <td>
                                                <div class="d-flex gap-2">
                                                    <a th:href="@{/admin/categories/edit/{id}(id=${cat.id})}"
                                                       class="btn btn-sm btn-outline-warning" title="Edit Category">
                                                        <i class="bi bi-pencil"></i>
                                                    </a>
                                                    <form th:action="@{/admin/categories/delete/{id}(id=${cat.id})}" method="post"
                                                          class="d-inline" onsubmit="return confirm('Delete this category?');">
                                                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                                        <button type="submit" class="btn btn-sm btn-outline-danger" title="Delete Category">
                                                            <i class="bi bi-trash"></i>
                                                        </button>
                                                    </form>
                                                </div>
                                            </td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/admin.js"></script>
</body>
</html>
