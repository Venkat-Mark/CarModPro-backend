<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Request Detail - CarModPro Admin</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body class="admin-page">
<div class="admin-wrapper">
    <div th:replace="~{fragments/layout :: adminSidebar('requests')}"></div>
    <div class="admin-main">
        <div th:replace="~{fragments/layout :: adminTopbar('Request Detail')}"></div>
        <div class="admin-content p-4">
            <div th:replace="~{fragments/navbar :: alerts}"></div>

            <div class="d-flex align-items-center mb-4 gap-3">
                <a th:href="@{/admin/requests}" class="btn btn-sm btn-outline-secondary">
                    <i class="bi bi-arrow-left"></i>
                </a>
                <div>
                    <h4 class="text-white mb-0">Request <span class="text-warning" th:text="${'#' + request.id}"></span></h4>
                    <p class="text-muted small mb-0"
                       th:text="${'Submitted ' + #temporals.format(request.requestDate, 'dd MMMM yyyy, hh:mm a')}"></p>
                </div>
                <div class="ms-auto">
                    <span class="badge fs-6"
                          th:classappend="${request.status.name() == 'PENDING'} ? 'bg-warning text-dark' :
                                          (${request.status.name() == 'APPROVED'} ? 'bg-info text-dark' :
                                          (${request.status.name() == 'IN_PROGRESS'} ? 'bg-primary' :
                                          (${request.status.name() == 'COMPLETED'} ? 'bg-success' :
                                          (${request.status.name() == 'REJECTED'} ? 'bg-danger' : 'bg-secondary'))))"
                          th:text="${request.status.name().replace('_', ' ')}">
                    </span>
                </div>
            </div>

            <div class="row g-4">
                <div class="col-lg-8">
                    <!-- Customer & Vehicle Info -->
                    <div class="row g-3 mb-4">
                        <div class="col-md-6">
                            <div class="content-card h-100">
                                <div class="content-card-header">
                                    <h6 class="text-white mb-0"><i class="bi bi-person me-2 text-warning"></i>Customer</h6>
                                </div>
                                <div class="content-card-body">
                                    <div class="vehicle-detail-row">
                                        <span class="text-muted small">Name</span>
                                        <span class="text-white small" th:text="${request.customer.fullName}"></span>
                                    </div>
                                    <div class="vehicle-detail-row">
                                        <span class="text-muted small">Email</span>
                                        <span class="text-white small" th:text="${request.customer.email}"></span>
                                    </div>
                                    <div class="vehicle-detail-row" th:if="${request.customer.phone}">
                                        <span class="text-muted small">Phone</span>
                                        <span class="text-white small" th:text="${request.customer.phone}"></span>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="content-card h-100">
                                <div class="content-card-header">
                                    <h6 class="text-white mb-0"><i class="bi bi-car-front me-2 text-warning"></i>Vehicle</h6>
                                </div>
                                <div class="content-card-body">
                                    <div class="vehicle-detail-row">
                                        <span class="text-muted small">Reg. Number</span>
                                        <span class="text-warning small" th:text="${request.vehicle.registrationNumber}"></span>
                                    </div>
                                    <div class="vehicle-detail-row">
                                        <span class="text-muted small">Vehicle</span>
                                        <span class="text-white small"
                                              th:text="${request.vehicle.brand + ' ' + request.vehicle.model + ' (' + request.vehicle.year + ')'}"></span>
                                    </div>
                                    <div class="vehicle-detail-row">
                                        <span class="text-muted small">Fuel</span>
                                        <span class="text-white small" th:text="${request.vehicle.fuelType}"></span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Services -->
                    <div class="content-card mb-4">
                        <div class="content-card-header">
                            <h6 class="text-white mb-0"><i class="bi bi-tools me-2 text-warning"></i>Services Requested</h6>
                        </div>
                        <div class="content-card-body">
                            <table class="table data-table mb-0">
                                <thead>
                                    <tr><th>Service</th><th>Category</th><th>Qty</th><th>Unit Price</th><th>Subtotal</th></tr>
                                </thead>
                                <tbody>
                                    <tr th:each="item : ${request.items}">
                                        <td class="text-white small" th:text="${item.service.name}"></td>
                                        <td><span class="badge bg-secondary" th:text="${item.service.category.name}"></span></td>
                                        <td class="text-white" th:text="${item.quantity}"></td>
                                        <td class="text-muted">₹<span th:text="${#numbers.formatDecimal(item.unitPrice, 0, 'COMMA', 0, 'POINT')}"></span></td>
                                        <td class="text-warning">₹<span th:text="${#numbers.formatDecimal(item.subtotal, 0, 'COMMA', 0, 'POINT')}"></span></td>
                                    </tr>
                                </tbody>
                                <tfoot>
                                    <tr>
                                        <td colspan="4" class="text-end text-muted">Estimated:</td>
                                        <td class="text-warning fw-bold">₹<span th:text="${#numbers.formatDecimal(request.estimatedCost, 0, 'COMMA', 0, 'POINT')}"></span></td>
                                    </tr>
                                    <tr th:if="${request.finalCost != null}">
                                        <td colspan="4" class="text-end text-muted">Final Cost:</td>
                                        <td class="text-success fw-bold">₹<span th:text="${#numbers.formatDecimal(request.finalCost, 0, 'COMMA', 0, 'POINT')}"></span></td>
                                    </tr>
                                </tfoot>
                            </table>
                        </div>
                    </div>

                    <!-- Customer Notes -->
                    <div class="content-card mb-4" th:if="${request.customerNotes}">
                        <div class="content-card-header">
                            <h6 class="text-white mb-0"><i class="bi bi-chat-dots me-2 text-warning"></i>Customer Notes</h6>
                        </div>
                        <div class="content-card-body">
                            <p class="text-white small mb-0" th:text="${request.customerNotes}"></p>
                        </div>
                    </div>

                    <!-- Feedback -->
                    <div class="content-card" th:if="${feedback != null}">
                        <div class="content-card-header">
                            <h6 class="text-white mb-0"><i class="bi bi-star me-2 text-warning"></i>Customer Feedback</h6>
                        </div>
                        <div class="content-card-body">
                            <div class="d-flex align-items-center gap-2 mb-2">
                                <span th:each="i : ${#numbers.sequence(1, 5)}"
                                      th:classappend="${i <= feedback.rating} ? 'text-warning' : 'text-muted'">
                                    <i class="bi bi-star-fill"></i>
                                </span>
                                <span class="text-white fw-semibold small" th:text="${feedback.rating + '/5'}"></span>
                            </div>
                            <p class="text-white small" th:if="${feedback.comments}" th:text="${feedback.comments}"></p>
                            <small class="text-muted" th:text="${'Submitted on ' + #temporals.format(feedback.createdAt, 'dd MMM yyyy')}"></small>
                        </div>
                    </div>
                </div>

                <!-- Right: Update Status -->
                <div class="col-lg-4">
                    <div class="content-card">
                        <div class="content-card-header">
                            <h6 class="text-white mb-0"><i class="bi bi-pencil-square me-2 text-warning"></i>Update Status</h6>
                        </div>
                        <div class="content-card-body">
                            <form th:action="@{/admin/requests/{id}/update-status(id=${request.id})}"
                                  method="post" th:object="${updateDto}">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                                <div class="mb-3">
                                    <label class="form-label text-muted small fw-semibold">NEW STATUS *</label>
                                    <select class="form-select" th:field="*{status}" required>
                                        <option value="">Select Status</option>
                                        <option th:each="s : ${statuses}" th:value="${s.name()}"
                                                th:text="${s.name().replace('_', ' ')}"
                                                th:selected="${s == request.status}">
                                        </option>
                                    </select>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label text-muted small fw-semibold">FINAL COST (₹)</label>
                                    <input type="number" class="form-control" th:field="*{finalCost}"
                                           th:value="${request.finalCost}"
                                           step="0.01" min="0" placeholder="Enter final amount if completed">
                                </div>

                                <div class="mb-3">
                                    <label class="form-label text-muted small fw-semibold">ADMIN NOTES</label>
                                    <textarea class="form-control" th:field="*{adminNotes}" rows="3"
                                              th:text="${request.adminNotes}"
                                              placeholder="Internal notes or status updates..."></textarea>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label text-muted small fw-semibold">REJECTION REASON</label>
                                    <input type="text" class="form-control" th:field="*{rejectionReason}"
                                           th:value="${request.rejectionReason}"
                                           placeholder="Fill if rejecting this request">
                                </div>

                                <button type="submit" class="btn btn-warning w-100 fw-semibold"
                                        onclick="return confirm('Update request status?')">
                                    <i class="bi bi-check-circle me-2"></i>Update Status
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/admin.js}"></script>
</body>
</html>
