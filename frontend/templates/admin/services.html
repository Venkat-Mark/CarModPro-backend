<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Services Management - CarModPro Admin</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body class="admin-page">
<div class="admin-wrapper">
    <div th:replace="~{fragments/layout :: adminSidebar('services')}"></div>
    <div class="admin-main">
        <div th:replace="~{fragments/layout :: adminTopbar('Services Catalog')}"></div>
        <div class="admin-content p-4">
            <div th:replace="~{fragments/navbar :: alerts}"></div>

            <!-- Top Actions & Filters -->
            <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
                <div>
                    <h4 class="text-white mb-0">Modification Services</h4>
                    <p class="text-muted small mb-0">Add, edit, or adjust pricing of services</p>
                </div>
                <a th:href="@{/admin/services/new}" class="btn btn-warning fw-semibold">
                    <i class="bi bi-plus-circle me-1"></i>Add New Service
                </a>
            </div>

            <!-- Search & Category Filter Card -->
            <div class="content-card mb-4">
                <div class="content-card-body">
                    <form th:action="@{/admin/services}" method="get" class="row g-3 align-items-end">
                        <div class="col-md-5">
                            <label class="form-label text-muted small fw-semibold">SEARCH</label>
                            <div class="input-group">
                                <span class="input-group-text bg-transparent border-secondary text-muted">
                                    <i class="bi bi-search"></i>
                                </span>
                                <input type="text" class="form-control" name="search"
                                       th:value="${searchQuery}"
                                       placeholder="Search service name or description...">
                            </div>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label text-muted small fw-semibold">CATEGORY</label>
                            <select class="form-select" name="category">
                                <option value="">All Categories</option>
                                <option th:each="cat : ${categories}"
                                        th:value="${cat.id}"
                                        th:text="${cat.name}"
                                        th:selected="${selectedCategory != null && selectedCategory == cat.id}">
                                </option>
                            </select>
                        </div>
                        <div class="col-md-3 d-flex gap-2">
                            <button type="submit" class="btn btn-warning w-100">Filter</button>
                            <a th:if="${searchQuery != null or selectedCategory != null}"
                               th:href="@{/admin/services}" class="btn btn-outline-secondary">Reset</a>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Table -->
            <div class="content-card">
                <div class="content-card-header d-flex justify-content-between align-items-center">
                    <h6 class="text-white mb-0">
                        <i class="bi bi-tools me-2 text-warning"></i>Service List
                        <span class="badge bg-secondary ms-2" th:text="${services.totalElements}"></span>
                    </h6>
                </div>
                <div class="content-card-body">
                    <div th:if="${services.isEmpty()}" class="empty-state py-5 text-center">
                        <i class="bi bi-tools fs-1 text-muted"></i>
                        <p class="text-muted mt-2">No modification services found.</p>
                        <a th:href="@{/admin/services/new}" class="btn btn-warning btn-sm">Add First Service</a>
                    </div>

                    <div th:if="${!services.isEmpty()}" class="table-responsive">
                        <table class="table data-table">
                            <thead>
                                <tr>
                                    <th>#ID</th>
                                    <th>Name</th>
                                    <th>Category</th>
                                    <th>Base Price</th>
                                    <th>Duration</th>
                                    <th>Status</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="svc : ${services.content}">
                                    <td class="text-warning fw-semibold" th:text="${'#' + svc.id}"></td>
                                    <td>
                                        <div class="text-white fw-semibold small" th:text="${svc.name}"></div>
                                        <div class="text-muted" style="font-size:11px" th:text="${#strings.abbreviate(svc.description, 60)}"></div>
                                    </td>
                                    <td>
                                        <span class="badge bg-secondary" th:text="${svc.category.name}"></span>
                                    </td>
                                    <td class="text-warning fw-semibold">
                                        ₹<span th:text="${#numbers.formatDecimal(svc.basePrice, 0, 'COMMA', 0, 'POINT')}"></span>
                                    </td>
                                    <td class="text-muted small" th:text="${svc.duration ?: '—'}"></td>
                                    <td>
                                        <form th:action="@{/admin/services/{id}/toggle(id=${svc.id})}" method="post" class="d-inline">
                                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                            <button type="submit" class="btn btn-sm"
                                                    th:classappend="${svc.available} ? 'btn-outline-success' : 'btn-outline-secondary'"
                                                    th:title="${svc.available} ? 'Click to make unavailable' : 'Click to make available'">
                                                <i class="bi" th:classappend="${svc.available} ? 'bi-check-circle-fill' : 'bi-x-circle'"></i>
                                                <span th:text="${svc.available} ? 'Available' : 'Unavailable'"></span>
                                            </button>
                                        </form>
                                    </td>
                                    <td>
                                        <div class="d-flex gap-2">
                                            <a th:href="@{/admin/services/edit/{id}(id=${svc.id})}"
                                               class="btn btn-sm btn-outline-warning" title="Edit Service">
                                                <i class="bi bi-pencil"></i>
                                            </a>
                                            <form th:action="@{/admin/services/delete/{id}(id=${svc.id})}" method="post"
                                                  class="d-inline" onsubmit="return confirm('Delete this service?');">
                                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                                <button type="submit" class="btn btn-sm btn-outline-danger" title="Delete Service">
                                                    <i class="bi bi-trash"></i>
                                                </button>
                                            </form>
                                        </div>
                                    </td>
                                </tr>
                            </tbody>
                        </table>

                        <!-- Pagination -->
                        <nav th:if="${totalPages > 1}" class="mt-3">
                            <ul class="pagination justify-content-center">
                                <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                                    <a class="page-link" th:href="@{/admin/services(page=${currentPage-1},search=${searchQuery},category=${selectedCategory})}">
                                        <i class="bi bi-chevron-left"></i>
                                    </a>
                                </li>
                                <li th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
                                    class="page-item" th:classappend="${i == currentPage} ? 'active'">
                                    <a class="page-link" th:href="@{/admin/services(page=${i},search=${searchQuery},category=${selectedCategory})}"
                                       th:text="${i + 1}"></a>
                                </li>
                                <li class="page-item" th:classappend="${currentPage == totalPages - 1} ? 'disabled'">
                                    <a class="page-link" th:href="@{/admin/services(page=${currentPage+1},search=${searchQuery},category=${selectedCategory})}">
                                        <i class="bi bi-chevron-right"></i>
                                    </a>
                                </li>
                            </ul>
                        </nav>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/admin.js}"></script>
</body>
</html>
