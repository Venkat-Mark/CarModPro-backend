<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle + ' - CarModPro Admin'}">Service Form</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/admin.css">
</head>
<body class="admin-page">
<div class="admin-wrapper">
    <div th:replace="~{fragments/layout :: adminSidebar('services')}"></div>
    <div class="admin-main">
        <div th:replace="~{fragments/layout :: adminTopbar(${pageTitle})}"></div>
        <div class="admin-content p-4">
            <div th:replace="~{fragments/navbar :: alerts}"></div>

            <div class="d-flex align-items-center mb-4 gap-3">
                <a th:href="@{/admin/services}" class="btn btn-sm btn-outline-secondary">
                    <i class="bi bi-arrow-left"></i> Back to Services
                </a>
                <h4 class="text-white mb-0" th:text="${pageTitle}">Add / Edit Service</h4>
            </div>

            <div class="row justify-content-center">
                <div class="col-lg-8">
                    <div class="content-card">
                        <div class="content-card-body p-4">
                            <form th:action="@{/admin/services/save}" method="post" th:object="${service}">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                <input type="hidden" th:field="*{id}"/>

                                <div class="row g-3">
                                    <div class="col-md-8">
                                        <label class="form-label text-muted small fw-semibold">SERVICE NAME *</label>
                                        <input type="text" class="form-control" th:field="*{name}"
                                               th:class="${#fields.hasErrors('name')} ? 'form-control is-invalid' : 'form-control'"
                                               placeholder="e.g. Ceramic Coating 9H" required>
                                        <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                                    </div>

                                    <div class="col-md-4">
                                        <label class="form-label text-muted small fw-semibold">CATEGORY *</label>
                                        <select class="form-select" name="categoryId" required>
                                            <option value="">Select Category</option>
                                            <option th:each="cat : ${categories}"
                                                    th:value="${cat.id}"
                                                    th:text="${cat.name}"
                                                    th:selected="${service.category != null && service.category.id == cat.id}">
                                            </option>
                                        </select>
                                    </div>

                                    <div class="col-md-6">
                                        <label class="form-label text-muted small fw-semibold">BASE PRICE (₹) *</label>
                                        <div class="input-group">
                                            <span class="input-group-text bg-dark border-secondary text-warning">₹</span>
                                            <input type="number" step="0.01" min="1" class="form-control" th:field="*{basePrice}"
                                                   th:class="${#fields.hasErrors('basePrice')} ? 'form-control is-invalid' : 'form-control'"
                                                   placeholder="15000.00" required>
                                        </div>
                                        <div class="invalid-feedback d-block text-danger small" th:if="${#fields.hasErrors('basePrice')}" th:errors="*{basePrice}"></div>
                                    </div>

                                    <div class="col-md-6">
                                        <label class="form-label text-muted small fw-semibold">ESTIMATED DURATION</label>
                                        <input type="text" class="form-control" th:field="*{duration}"
                                               placeholder="e.g. 2-3 days or Same day">
                                    </div>

                                    <div class="col-12">
                                        <label class="form-label text-muted small fw-semibold">SERVICE DESCRIPTION *</label>
                                        <textarea class="form-control" th:field="*{description}" rows="4"
                                                  placeholder="Provide a detailed description of the modification process, benefits, and materials used..." required></textarea>
                                        <div class="invalid-feedback" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></div>
                                    </div>

                                    <div class="col-12">
                                        <div class="form-check form-switch mt-2">
                                            <input class="form-check-input" type="checkbox" role="switch" id="availSwitch"
                                                   th:field="*{available}">
                                            <label class="form-check-label text-white" for="availSwitch">Make available for customer requests</label>
                                        </div>
                                    </div>

                                    <div class="col-12 d-flex gap-3 mt-4">
                                        <button type="submit" class="btn btn-warning px-4 fw-semibold">
                                            <i class="bi bi-check2-circle me-1"></i>Save Service
                                        </button>
                                        <a th:href="@{/admin/services}" class="btn btn-outline-secondary px-4">Cancel</a>
                                    </div>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/admin.js"></script>
</body>
</html>
