<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${customer.fullName + ' - Customer Profile'}">Customer Details</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/admin.css">
</head>
<body class="admin-page">
<div class="admin-wrapper">
    <div th:replace="~{fragments/layout :: adminSidebar('customers')}"></div>
    <div class="admin-main">
        <div th:replace="~{fragments/layout :: adminTopbar('Customer Details')}"></div>
        <div class="admin-content p-4">
            <div th:replace="~{fragments/navbar :: alerts}"></div>

            <div class="d-flex align-items-center mb-4 gap-3">
                <a th:href="@{/admin/customers}" class="btn btn-sm btn-outline-secondary">
                    <i class="bi bi-arrow-left"></i> Back to Customers
                </a>
                <h4 class="text-white mb-0" th:text="${customer.fullName}">Customer Name</h4>
                <span class="badge" th:classappend="${customer.status.name() == 'ACTIVE'} ? 'bg-success' : 'bg-danger'"
                      th:text="${customer.status}"></span>
            </div>

            <div class="row g-4 mb-4">
                <!-- Customer Overview Card -->
                <div class="col-lg-4">
                    <div class="content-card h-100">
                        <div class="content-card-header">
                            <h6 class="text-white mb-0"><i class="bi bi-person-badge me-2 text-warning"></i>Profile Info</h6>
                        </div>
                        <div class="content-card-body">
                            <div class="vehicle-detail-row">
                                <span class="text-muted small">Customer ID</span>
                                <span class="text-warning small" th:text="${'#' + customer.id}"></span>
                            </div>
                            <div class="vehicle-detail-row">
                                <span class="text-muted small">Email</span>
                                <span class="text-white small" th:text="${customer.email}"></span>
                            </div>
                            <div class="vehicle-detail-row">
                                <span class="text-muted small">Phone</span>
                                <span class="text-white small" th:text="${customer.phone ?: 'Not provided'}"></span>
                            </div>
                            <div class="vehicle-detail-row">
                                <span class="text-muted small">Registered Since</span>
                                <span class="text-white small" th:text="${#temporals.format(customer.createdAt, 'dd MMM yyyy, hh:mm a')}"></span>
                            </div>
                            <div class="mt-4">
                                <form th:action="@{/admin/customers/{id}/toggle-status(id=${customer.id})}" method="post">
                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                    <button type="submit" class="btn w-100"
                                            th:classappend="${customer.status.name() == 'ACTIVE'} ? 'btn-outline-danger' : 'btn-outline-success'">
                                        <i class="bi" th:classappend="${customer.status.name() == 'ACTIVE'} ? 'bi-slash-circle' : 'bi-check-circle'"></i>
                                        <span th:text="${customer.status.name() == 'ACTIVE'} ? 'Suspend Account' : 'Activate Account'"></span>
                                    </button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Customer's Vehicles -->
                <div class="col-lg-8">
                    <div class="content-card h-100">
                        <div class="content-card-header d-flex justify-content-between align-items-center">
                            <h6 class="text-white mb-0"><i class="bi bi-car-front me-2 text-warning"></i>Registered Vehicles</h6>
                            <span class="badge bg-secondary" th:text="${#lists.size(vehicles)} + ' vehicles'"></span>
                        </div>
                        <div class="content-card-body">
                            <div th:if="${#lists.isEmpty(vehicles)}" class="empty-state py-4 text-center">
                                <i class="bi bi-car-front fs-2 text-muted"></i>
                                <p class="text-muted small mt-2">Customer has not added any vehicles yet.</p>
                            </div>

                            <div th:if="${!#lists.isEmpty(vehicles)}" class="row g-3">
                                <div th:each="v : ${vehicles}" class="col-md-6">
                                    <div class="p-3 rounded bg-dark border border-secondary">
                                        <div class="d-flex align-items-center gap-3">
                                            <i class="bi bi-car-front-fill text-warning fs-3"></i>
                                            <div>
                                                <h6 class="text-white mb-1" th:text="${v.brand + ' ' + v.model}"></h6>
                                                <div class="text-warning small fw-semibold" th:text="${v.registrationNumber}"></div>
                                                <div class="text-muted" style="font-size:11px" th:text="${v.year + ' • ' + v.fuelType}"></div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Customer's Request History -->
            <div class="content-card">
                <div class="content-card-header">
                    <h6 class="text-white mb-0"><i class="bi bi-clock-history me-2 text-warning"></i>Modification Request History</h6>
                </div>
                <div class="content-card-body">
                    <div th:if="${#lists.isEmpty(requests)}" class="empty-state py-4 text-center">
                        <p class="text-muted mb-0">No modification requests made by this customer.</p>
                    </div>

                    <div th:if="${!#lists.isEmpty(requests)}" class="table-responsive">
                        <table class="table data-table">
                            <thead>
                                <tr>
                                    <th>#ID</th>
                                    <th>Vehicle</th>
                                    <th>Date</th>
                                    <th>Estimated</th>
                                    <th>Final</th>
                                    <th>Status</th>
                                    <th>Action</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="req : ${requests}">
                                    <td class="text-warning fw-semibold" th:text="${'#' + req.id}"></td>
                                    <td class="text-white small" th:text="${req.vehicle.brand + ' ' + req.vehicle.model + ' (' + req.vehicle.registrationNumber + ')'}"></td>
                                    <td class="text-muted small" th:text="${#temporals.format(req.requestDate, 'dd MMM yyyy')}"></td>
                                    <td class="text-white">₹<span th:text="${#numbers.formatDecimal(req.estimatedCost, 0, 'COMMA', 0, 'POINT')}"></span></td>
                                    <td class="text-success">
                                        <span th:if="${req.finalCost != null}">₹<span th:text="${#numbers.formatDecimal(req.finalCost, 0, 'COMMA', 0, 'POINT')}"></span></span>
                                        <span th:unless="${req.finalCost != null}" class="text-muted">—</span>
                                    </td>
                                    <td>
                                        <span class="badge"
                                              th:classappend="${req.status.name() == 'PENDING'} ? 'bg-warning text-dark' :
                                                              (${req.status.name() == 'APPROVED'} ? 'bg-info text-dark' :
                                                              (${req.status.name() == 'IN_PROGRESS'} ? 'bg-primary' :
                                                              (${req.status.name() == 'COMPLETED'} ? 'bg-success' :
                                                              (${req.status.name() == 'REJECTED'} ? 'bg-danger' : 'bg-secondary'))))"
                                              th:text="${req.status.name().replace('_', ' ')}">
                                        </span>
                                    </td>
                                    <td>
                                        <a th:href="@{/admin/requests/{id}(id=${req.id})}" class="btn btn-sm btn-outline-warning">
                                            <i class="bi bi-eye"></i> View
                                        </a>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/admin.js"></script>
</body>
</html>
