<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - CarModPro</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body class="admin-page">

<div class="admin-wrapper">
    <div th:replace="~{fragments/layout :: adminSidebar('dashboard')}"></div>

    <div class="admin-main">
        <div th:replace="~{fragments/layout :: adminTopbar('Dashboard')}"></div>

        <div class="admin-content p-4">
            <div th:replace="~{fragments/navbar :: alerts}"></div>

            <!-- Stats Row 1 -->
            <div class="row g-3 mb-4">
                <div class="col-sm-6 col-lg-3">
                    <div class="admin-stat-card stat-blue">
                        <div class="stat-icon"><i class="bi bi-people-fill"></i></div>
                        <div>
                            <p class="stat-label">TOTAL CUSTOMERS</p>
                            <h2 class="stat-value" th:text="${dashboard.totalCustomers}">0</h2>
                        </div>
                        <a th:href="@{/admin/customers}" class="stat-link"><i class="bi bi-arrow-right-circle"></i></a>
                    </div>
                </div>
                <div class="col-sm-6 col-lg-3">
                    <div class="admin-stat-card stat-teal">
                        <div class="stat-icon"><i class="bi bi-car-front-fill"></i></div>
                        <div>
                            <p class="stat-label">REGISTERED VEHICLES</p>
                            <h2 class="stat-value" th:text="${dashboard.totalVehicles}">0</h2>
                        </div>
                        <a th:href="@{/admin/vehicles}" class="stat-link"><i class="bi bi-arrow-right-circle"></i></a>
                    </div>
                </div>
                <div class="col-sm-6 col-lg-3">
                    <div class="admin-stat-card stat-purple">
                        <div class="stat-icon"><i class="bi bi-list-task"></i></div>
                        <div>
                            <p class="stat-label">TOTAL REQUESTS</p>
                            <h2 class="stat-value" th:text="${dashboard.totalRequests}">0</h2>
                        </div>
                        <a th:href="@{/admin/requests}" class="stat-link"><i class="bi bi-arrow-right-circle"></i></a>
                    </div>
                </div>
                <div class="col-sm-6 col-lg-3">
                    <div class="admin-stat-card stat-gold">
                        <div class="stat-icon"><i class="bi bi-currency-rupee"></i></div>
                        <div>
                            <p class="stat-label">TOTAL REVENUE</p>
                            <h2 class="stat-value">
                                ₹<span th:text="${#numbers.formatDecimal(dashboard.totalRevenue, 0, 'COMMA', 0, 'POINT')}">0</span>
                            </h2>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Stats Row 2 -->
            <div class="row g-3 mb-4">
                <div class="col-sm-6 col-lg-2-4">
                    <div class="mini-stat-card">
                        <span class="mini-stat-icon text-warning"><i class="bi bi-hourglass-split"></i></span>
                        <div>
                            <p class="mini-stat-label">Pending</p>
                            <h4 class="mini-stat-value text-warning" th:text="${dashboard.pendingRequests}">0</h4>
                        </div>
                    </div>
                </div>
                <div class="col-sm-6 col-lg-2-4">
                    <div class="mini-stat-card">
                        <span class="mini-stat-icon text-info"><i class="bi bi-check2-circle"></i></span>
                        <div>
                            <p class="mini-stat-label">Approved</p>
                            <h4 class="mini-stat-value text-info" th:text="${dashboard.approvedRequests}">0</h4>
                        </div>
                    </div>
                </div>
                <div class="col-sm-6 col-lg-2-4">
                    <div class="mini-stat-card">
                        <span class="mini-stat-icon text-primary"><i class="bi bi-tools"></i></span>
                        <div>
                            <p class="mini-stat-label">In Progress</p>
                            <h4 class="mini-stat-value text-primary" th:text="${dashboard.inProgressRequests}">0</h4>
                        </div>
                    </div>
                </div>
                <div class="col-sm-6 col-lg-2-4">
                    <div class="mini-stat-card">
                        <span class="mini-stat-icon text-success"><i class="bi bi-trophy"></i></span>
                        <div>
                            <p class="mini-stat-label">Completed</p>
                            <h4 class="mini-stat-value text-success" th:text="${dashboard.completedRequests}">0</h4>
                        </div>
                    </div>
                </div>
                <div class="col-sm-6 col-lg-2-4">
                    <div class="mini-stat-card">
                        <span class="mini-stat-icon text-danger"><i class="bi bi-x-circle"></i></span>
                        <div>
                            <p class="mini-stat-label">Rejected</p>
                            <h4 class="mini-stat-value text-danger" th:text="${dashboard.rejectedRequests}">0</h4>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Charts Row -->
            <div class="row g-4">
                <div class="col-lg-8">
                    <div class="content-card">
                        <div class="content-card-header">
                            <h6 class="text-white mb-0">
                                <i class="bi bi-bar-chart-line me-2 text-warning"></i>
                                Monthly Request Activity (<span th:text="${#dates.year(#dates.createNow())}"></span>)
                            </h6>
                        </div>
                        <div class="content-card-body">
                            <canvas id="monthlyChart" height="100"></canvas>
                        </div>
                    </div>
                </div>
                <div class="col-lg-4">
                    <div class="content-card">
                        <div class="content-card-header">
                            <h6 class="text-white mb-0">
                                <i class="bi bi-pie-chart me-2 text-warning"></i>Requests by Status
                            </h6>
                        </div>
                        <div class="content-card-body">
                            <canvas id="statusChart" height="200"></canvas>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Quick Actions -->
            <div class="row g-3 mt-4">
                <div class="col-12">
                    <h6 class="text-muted small fw-semibold mb-3">QUICK ACTIONS</h6>
                </div>
                <div class="col-md-3">
                    <a th:href="@{/admin/requests?status=PENDING}" class="quick-action-card text-decoration-none">
                        <i class="bi bi-hourglass-split text-warning"></i>
                        <span class="text-white small">Review Pending</span>
                    </a>
                </div>
                <div class="col-md-3">
                    <a th:href="@{/admin/services/new}" class="quick-action-card text-decoration-none">
                        <i class="bi bi-plus-circle text-success"></i>
                        <span class="text-white small">Add Service</span>
                    </a>
                </div>
                <div class="col-md-3">
                    <a th:href="@{/admin/customers}" class="quick-action-card text-decoration-none">
                        <i class="bi bi-people text-info"></i>
                        <span class="text-white small">View Customers</span>
                    </a>
                </div>
                <div class="col-md-3">
                    <a th:href="@{/admin/feedback}" class="quick-action-card text-decoration-none">
                        <i class="bi bi-star-fill text-warning"></i>
                        <span class="text-white small">View Feedback</span>
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script th:inline="javascript">
/*<![CDATA[*/
const monthlyData = /*[[${dashboard.monthlyRequestCounts}]]*/ [];
const statusData = /*[[${dashboard.requestsByStatus}]]*/ {};

// Monthly Bar Chart
const monthCtx = document.getElementById('monthlyChart').getContext('2d');
new Chart(monthCtx, {
    type: 'bar',
    data: {
        labels: ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],
        datasets: [{
            label: 'Requests',
            data: monthlyData,
            backgroundColor: 'rgba(255, 193, 7, 0.7)',
            borderColor: '#ffc107',
            borderWidth: 1,
            borderRadius: 4
        }]
    },
    options: {
        responsive: true,
        plugins: { legend: { display: false } },
        scales: {
            x: { ticks: { color: '#999' }, grid: { color: '#2a2d3a' } },
            y: { ticks: { color: '#999' }, grid: { color: '#2a2d3a' }, beginAtZero: true }
        }
    }
});

// Status Donut Chart
const statusCtx = document.getElementById('statusChart').getContext('2d');
const statusLabels = Object.keys(statusData).map(k => k.replace('_', ' '));
const statusValues = Object.values(statusData);
new Chart(statusCtx, {
    type: 'doughnut',
    data: {
        labels: statusLabels,
        datasets: [{
            data: statusValues,
            backgroundColor: ['#ffc107','#0dcaf0','#0d6efd','#198754','#dc3545','#6c757d'],
            borderWidth: 0
        }]
    },
    options: {
        responsive: true,
        plugins: {
            legend: {
                position: 'bottom',
                labels: { color: '#999', boxWidth: 12, padding: 10 }
            }
        }
    }
});

// Sidebar toggle
document.getElementById('sidebarToggle')?.addEventListener('click', () => {
    document.getElementById('adminSidebar').classList.toggle('collapsed');
    document.querySelector('.admin-main').classList.toggle('expanded');
});
/*]]>*/
</script>
</body>
</html>
