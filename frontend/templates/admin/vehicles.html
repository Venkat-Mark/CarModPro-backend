<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Registered Vehicles - CarModPro Admin</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/admin.css">
</head>
<body class="admin-page">
<div class="admin-wrapper">
    <div th:replace="~{fragments/layout :: adminSidebar('vehicles')}"></div>
    <div class="admin-main">
        <div th:replace="~{fragments/layout :: adminTopbar('Registered Vehicles')}"></div>
        <div class="admin-content p-4">
            <div th:replace="~{fragments/navbar :: alerts}"></div>

            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h4 class="text-white mb-0">Customer Vehicles</h4>
                    <p class="text-muted small mb-0">Complete registry of all customer vehicles in the system</p>
                </div>
            </div>

            <div class="content-card">
                <div class="content-card-header d-flex justify-content-between align-items-center">
                    <h6 class="text-white mb-0">
                        <i class="bi bi-car-front-fill me-2 text-warning"></i>Vehicles
                        <span class="badge bg-secondary ms-2" th:text="${vehicles.totalElements}"></span>
                    </h6>
                </div>
                <div class="content-card-body">
                    <div th:if="${vehicles.isEmpty()}" class="empty-state py-5 text-center">
                        <i class="bi bi-car-front fs-1 text-muted"></i>
                        <p class="text-muted mt-2">No vehicles registered yet.</p>
                    </div>

                    <div th:if="${!vehicles.isEmpty()}" class="table-responsive">
                        <table class="table data-table">
                            <thead>
                                <tr>
                                    <th>#ID</th>
                                    <th>Registration No.</th>
                                    <th>Make &amp; Model</th>
                                    <th>Year</th>
                                    <th>Fuel Type</th>
                                    <th>Owner</th>
                                    <th>Color</th>
                                    <th>Added Date</th>
                                    <th>Requests</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="v : ${vehicles.content}">
                                    <td class="text-warning fw-semibold" th:text="${'#' + v.id}"></td>
                                    <td class="text-warning fw-semibold small" th:text="${v.registrationNumber}"></td>
                                    <td class="text-white fw-semibold small" th:text="${v.brand + ' ' + v.model}"></td>
                                    <td class="text-muted small" th:text="${v.year}"></td>
                                    <td><span class="badge bg-secondary" th:text="${v.fuelType}"></span></td>
                                    <td>
                                        <a th:href="@{/admin/customers/{id}(id=${v.owner.id})}"
                                           class="text-white text-decoration-none small hover-warning">
                                            <i class="bi bi-person me-1 text-warning"></i><span th:text="${v.owner.fullName}"></span>
                                        </a>
                                    </td>
                                    <td class="text-muted small" th:text="${v.color ?: '—'}"></td>
                                    <td class="text-muted small" th:text="${#temporals.format(v.createdAt, 'dd MMM yyyy')}"></td>
                                    <td>
                                        <span class="badge bg-dark border border-secondary"
                                              th:text="${#lists.size(v.modificationRequests)} + ' orders'"></span>
                                    </td>
                                </tr>
                            </tbody>
                        </table>

                        <!-- Pagination -->
                        <nav th:if="${totalPages > 1}" class="mt-3">
                            <ul class="pagination justify-content-center">
                                <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                                    <a class="page-link" th:href="@{/admin/vehicles(page=${currentPage-1})}">
                                        <i class="bi bi-chevron-left"></i>
                                    </a>
                                </li>
                                <li th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
                                    class="page-item" th:classappend="${i == currentPage} ? 'active'">
                                    <a class="page-link" th:href="@{/admin/vehicles(page=${i})}"
                                       th:text="${i + 1}"></a>
                                </li>
                                <li class="page-item" th:classappend="${currentPage == totalPages - 1} ? 'disabled'">
                                    <a class="page-link" th:href="@{/admin/vehicles(page=${currentPage+1})}">
                                        <i class="bi bi-chevron-right"></i>
                                    </a>
                                </li>
                            </ul>
                        </nav>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/admin.js"></script>
</body>
</html>
