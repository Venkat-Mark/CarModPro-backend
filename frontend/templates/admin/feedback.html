<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Feedback &amp; Ratings - CarModPro Admin</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/admin.css">
</head>
<body class="admin-page">
<div class="admin-wrapper">
    <div th:replace="~{fragments/layout :: adminSidebar('feedback')}"></div>
    <div class="admin-main">
        <div th:replace="~{fragments/layout :: adminTopbar('Customer Feedback')}"></div>
        <div class="admin-content p-4">
            <div th:replace="~{fragments/navbar :: alerts}"></div>

            <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
                <div>
                    <h4 class="text-white mb-0">Customer Feedback &amp; Reviews</h4>
                    <p class="text-muted small mb-0">Monitor service quality and customer satisfaction</p>
                </div>
                <div class="rating-summary-pill d-flex align-items-center gap-2 px-3 py-2 rounded-pill bg-dark border border-warning">
                    <i class="bi bi-star-fill text-warning fs-5"></i>
                    <span class="text-white fw-bold fs-5" th:text="${avgRating}">0.0</span>
                    <span class="text-muted small">/ 5.0 Average</span>
                </div>
            </div>

            <div class="content-card">
                <div class="content-card-header d-flex justify-content-between align-items-center">
                    <h6 class="text-white mb-0">
                        <i class="bi bi-chat-quote-fill me-2 text-warning"></i>All Reviews
                        <span class="badge bg-secondary ms-2" th:text="${feedbacks.totalElements}"></span>
                    </h6>
                </div>
                <div class="content-card-body">
                    <div th:if="${feedbacks.isEmpty()}" class="empty-state py-5 text-center">
                        <i class="bi bi-chat-square-dots fs-1 text-muted"></i>
                        <p class="text-muted mt-2">No feedback submitted by customers yet.</p>
                    </div>

                    <div th:if="${!feedbacks.isEmpty()}" class="table-responsive">
                        <table class="table data-table">
                            <thead>
                                <tr>
                                    <th>#ID</th>
                                    <th>Customer</th>
                                    <th>Request</th>
                                    <th>Rating</th>
                                    <th>Comments</th>
                                    <th>Date</th>
                                    <th>Action</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="fb : ${feedbacks.content}">
                                    <td class="text-warning fw-semibold" th:text="${'#' + fb.id}"></td>
                                    <td>
                                        <div class="text-white fw-semibold small" th:text="${fb.customer.fullName}"></div>
                                        <div class="text-muted" style="font-size:11px" th:text="${fb.customer.email}"></div>
                                    </td>
                                    <td>
                                        <a th:href="@{/admin/requests/{id}(id=${fb.request.id})}" class="text-warning text-decoration-none small">
                                            <span th:text="${'#' + fb.request.id + ' - ' + fb.request.vehicle.brand + ' ' + fb.request.vehicle.model}"></span>
                                        </a>
                                    </td>
                                    <td>
                                        <div class="text-warning d-flex align-items-center gap-1">
                                            <span th:each="i : ${#numbers.sequence(1, 5)}"
                                                  th:classappend="${i <= fb.rating} ? 'text-warning' : 'text-secondary'">
                                                <i class="bi bi-star-fill" style="font-size:12px"></i>
                                            </span>
                                            <span class="text-white small ms-1" th:text="${fb.rating + '/5'}"></span>
                                        </div>
                                    </td>
                                    <td>
                                        <p class="text-white small mb-0" th:text="${fb.comments ?: 'No additional comment'}"></p>
                                    </td>
                                    <td class="text-muted small" th:text="${#temporals.format(fb.createdAt, 'dd MMM yyyy')}"></td>
                                    <td>
                                        <form th:action="@{/admin/feedback/delete/{id}(id=${fb.id})}" method="post"
                                              class="d-inline" onsubmit="return confirm('Delete this feedback entry?');">
                                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                            <button type="submit" class="btn btn-sm btn-outline-danger" title="Delete Review">
                                                <i class="bi bi-trash"></i>
                                            </button>
                                        </form>
                                    </td>
                                </tr>
                            </tbody>
                        </table>

                        <!-- Pagination -->
                        <nav th:if="${totalPages > 1}" class="mt-3">
                            <ul class="pagination justify-content-center">
                                <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                                    <a class="page-link" th:href="@{/admin/feedback(page=${currentPage-1})}">
                                        <i class="bi bi-chevron-left"></i>
                                    </a>
                                </li>
                                <li th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
                                    class="page-item" th:classappend="${i == currentPage} ? 'active'">
                                    <a class="page-link" th:href="@{/admin/feedback(page=${i})}"
                                       th:text="${i + 1}"></a>
                                </li>
                                <li class="page-item" th:classappend="${currentPage == totalPages - 1} ? 'disabled'">
                                    <a class="page-link" th:href="@{/admin/feedback(page=${currentPage+1})}">
                                        <i class="bi bi-chevron-right"></i>
                                    </a>
                                </li>
                            </ul>
                        </nav>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/admin.js"></script>
</body>
</html>
