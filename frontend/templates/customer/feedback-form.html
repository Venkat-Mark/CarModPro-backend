<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit Feedback - CarModPro</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="stylesheet" th:href="@{/css/customer.css}">
</head>
<body class="customer-page">
<div th:replace="~{fragments/layout :: customerNav('requests')}"></div>
<div class="customer-content">
    <div class="container-fluid px-4 py-4">

        <div class="d-flex align-items-center mb-4 gap-3">
            <a th:href="@{/customer/requests/{id}(id=${request.id})}" class="btn btn-sm btn-outline-secondary">
                <i class="bi bi-arrow-left"></i>
            </a>
            <div>
                <h4 class="text-white mb-0">Submit Feedback</h4>
                <p class="text-muted small mb-0">
                    Request <span class="text-warning" th:text="${'#' + request.id}"></span> —
                    <span th:text="${request.vehicle.brand + ' ' + request.vehicle.model}"></span>
                </p>
            </div>
        </div>

        <div class="row justify-content-center">
            <div class="col-lg-6">
                <div class="content-card">
                    <div class="content-card-header text-center">
                        <div class="mb-2">
                            <i class="bi bi-star-fill text-warning fs-2"></i>
                        </div>
                        <h5 class="text-white mb-1">How was the service?</h5>
                        <p class="text-muted small">Your feedback helps us improve</p>
                    </div>
                    <div class="content-card-body">
                        <form th:action="@{/customer/requests/{id}/feedback(id=${request.id})}"
                              method="post">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                            <!-- Star Rating -->
                            <div class="mb-4 text-center">
                                <label class="form-label text-muted small fw-semibold d-block mb-3">YOUR RATING *</label>
                                <div class="star-rating" id="starRating">
                                    <i class="bi bi-star star-btn" data-value="1"></i>
                                    <i class="bi bi-star star-btn" data-value="2"></i>
                                    <i class="bi bi-star star-btn" data-value="3"></i>
                                    <i class="bi bi-star star-btn" data-value="4"></i>
                                    <i class="bi bi-star star-btn" data-value="5"></i>
                                </div>
                                <input type="hidden" name="rating" id="ratingInput" required>
                                <p class="text-muted small mt-2" id="ratingLabel">Click to rate</p>
                            </div>

                            <div class="mb-4">
                                <label class="form-label text-muted small fw-semibold">COMMENTS (Optional)</label>
                                <textarea class="form-control" name="comments" rows="5"
                                          placeholder="Share your experience, what you liked, or suggestions for improvement..."></textarea>
                            </div>

                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-warning fw-semibold py-2" id="submitBtn" disabled>
                                    <i class="bi bi-send me-2"></i>Submit Feedback
                                </button>
                                <a th:href="@{/customer/requests/{id}(id=${request.id})}"
                                   class="btn btn-outline-secondary">
                                    Cancel
                                </a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
const labels = ['', 'Poor', 'Fair', 'Good', 'Very Good', 'Excellent'];
let selectedRating = 0;

document.querySelectorAll('.star-btn').forEach(star => {
    star.addEventListener('click', function() {
        selectedRating = parseInt(this.dataset.value);
        document.getElementById('ratingInput').value = selectedRating;
        document.getElementById('ratingLabel').textContent = labels[selectedRating];
        document.getElementById('submitBtn').disabled = false;
        updateStars(selectedRating);
    });
    star.addEventListener('mouseover', function() {
        updateStars(parseInt(this.dataset.value));
    });
    star.addEventListener('mouseout', function() {
        updateStars(selectedRating);
    });
});

function updateStars(value) {
    document.querySelectorAll('.star-btn').forEach((s, i) => {
        s.className = i < value ? 'bi bi-star-fill star-btn active' : 'bi bi-star star-btn';
    });
}
</script>
</body>
</html>
