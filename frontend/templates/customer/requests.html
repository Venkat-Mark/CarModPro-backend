<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Requests - CarModPro</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="stylesheet" th:href="@{/css/customer.css}">
</head>
<body class="customer-page">
<div th:replace="~{fragments/layout :: customerNav('requests')}"></div>
<div class="customer-content">
    <div class="container-fluid px-4 py-4">
        <div th:replace="~{fragments/navbar :: alerts}"></div>

        <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
            <div>
                <h4 class="text-white mb-1"><i class="bi bi-list-task me-2 text-warning"></i>My Modification Requests</h4>
                <p class="text-muted small mb-0">Track all your service requests</p>
            </div>
            <a th:href="@{/customer/requests/new}" class="btn btn-warning">
                <i class="bi bi-plus-circle me-2"></i>New Request
            </a>
        </div>

        <div class="content-card">
            <div class="content-card-body">
                <div th:if="${requests.isEmpty()}" class="empty-state py-5 text-center">
                    <i class="bi bi-inbox fs-1 text-muted"></i>
                    <h5 class="text-white mt-3">No Requests Found</h5>
                    <p class="text-muted">You haven't submitted any modification requests yet.</p>
                    <a th:href="@{/customer/requests/new}" class="btn btn-warning">
                        <i class="bi bi-plus-circle me-2"></i>Submit Your First Request
                    </a>
                </div>

                <div th:if="${!requests.isEmpty()}" class="table-responsive">
                    <table class="table data-table">
                        <thead>
                            <tr>
                                <th>#ID</th>
                                <th>Vehicle</th>
                                <th>Request Date</th>
                                <th>Estimated Cost</th>
                                <th>Final Cost</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="req : ${requests.content}">
                                <td class="text-warning fw-semibold" th:text="${'#' + req.id}"></td>
                                <td>
                                    <span class="text-white fw-semibold small"
                                          th:text="${req.vehicle.brand + ' ' + req.vehicle.model}"></span>
                                    <small class="d-block text-muted"
                                           th:text="${req.vehicle.registrationNumber}"></small>
                                </td>
                                <td class="text-muted small"
                                    th:text="${#temporals.format(req.requestDate, 'dd MMM yyyy, hh:mm a')}"></td>
                                <td class="text-white">
                                    ₹<span th:text="${#numbers.formatDecimal(req.estimatedCost, 0, 'COMMA', 0, 'POINT')}"></span>
                                </td>
                                <td class="text-success">
                                    <span th:if="${req.finalCost != null}">
                                        ₹<span th:text="${#numbers.formatDecimal(req.finalCost, 0, 'COMMA', 0, 'POINT')}"></span>
                                    </span>
                                    <span th:unless="${req.finalCost != null}" class="text-muted">—</span>
                                </td>
                                <td>
                                    <span class="badge"
                                          th:classappend="${req.status.name() == 'PENDING'} ? 'bg-warning text-dark' :
                                                          (${req.status.name() == 'APPROVED'} ? 'bg-info text-dark' :
                                                          (${req.status.name() == 'IN_PROGRESS'} ? 'bg-primary' :
                                                          (${req.status.name() == 'COMPLETED'} ? 'bg-success' :
                                                          (${req.status.name() == 'REJECTED'} ? 'bg-danger' : 'bg-secondary'))))"
                                          th:text="${req.status.name().replace('_', ' ')}">
                                    </span>
                                </td>
                                <td>
                                    <div class="d-flex gap-1">
                                        <a th:href="@{/customer/requests/{id}(id=${req.id})}"
                                           class="btn btn-sm btn-outline-warning" title="View Details">
                                            <i class="bi bi-eye"></i>
                                        </a>
                                        <th:block th:if="${req.status.name() == 'PENDING' or req.status.name() == 'APPROVED'}">
                                            <form th:action="@{/customer/requests/{id}/cancel(id=${req.id})}"
                                                  method="post" class="d-inline"
                                                  onsubmit="return confirm('Cancel this request?')">
                                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                                <button type="submit" class="btn btn-sm btn-outline-danger" title="Cancel">
                                                    <i class="bi bi-x-circle"></i>
                                                </button>
                                            </form>
                                        </th:block>
                                        <th:block th:if="${req.status.name() == 'COMPLETED'}">
                                            <a th:href="@{/customer/requests/{id}/feedback(id=${req.id})}"
                                               class="btn btn-sm btn-outline-success" title="Rate Service">
                                                <i class="bi bi-star"></i>
                                            </a>
                                        </th:block>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>

                    <!-- Pagination -->
                    <nav th:if="${totalPages > 1}" class="mt-3">
                        <ul class="pagination justify-content-center">
                            <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                                <a class="page-link" th:href="@{/customer/requests(page=${currentPage - 1})}">
                                    <i class="bi bi-chevron-left"></i>
                                </a>
                            </li>
                            <li th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
                                class="page-item" th:classappend="${i == currentPage} ? 'active'">
                                <a class="page-link" th:href="@{/customer/requests(page=${i})}"
                                   th:text="${i + 1}"></a>
                            </li>
                            <li class="page-item" th:classappend="${currentPage == totalPages - 1} ? 'disabled'">
                                <a class="page-link" th:href="@{/customer/requests(page=${currentPage + 1})}">
                                    <i class="bi bi-chevron-right"></i>
                                </a>
                            </li>
                        </ul>
                    </nav>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
