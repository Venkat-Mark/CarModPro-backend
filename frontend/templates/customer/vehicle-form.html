<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle + ' - CarModPro'}">Vehicle - CarModPro</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="stylesheet" th:href="@{/css/customer.css}">
</head>
<body class="customer-page">
<div th:replace="~{fragments/layout :: customerNav('vehicles')}"></div>
<div class="customer-content">
    <div class="container-fluid px-4 py-4">
        <div th:replace="~{fragments/navbar :: alerts}"></div>

        <div class="row justify-content-center">
            <div class="col-lg-7">
                <div class="content-card">
                    <div class="content-card-header">
                        <div class="d-flex align-items-center gap-3">
                            <div class="card-icon-circle">
                                <i class="bi bi-car-front-fill text-warning"></i>
                            </div>
                            <div>
                                <h5 class="text-white mb-0" th:text="${pageTitle}">Add Vehicle</h5>
                                <p class="text-muted small mb-0">Enter your vehicle details below</p>
                            </div>
                        </div>
                    </div>
                    <div class="content-card-body">

                        <div th:if="${errorMessage}" class="alert alert-danger d-flex align-items-center mb-3">
                            <i class="bi bi-exclamation-triangle-fill me-2"></i>
                            <span th:text="${errorMessage}"></span>
                        </div>

                        <form th:action="${isEdit} ? @{/customer/vehicles/edit/{id}(id=${vehicle.id})} : @{/customer/vehicles/add}"
                              method="post" th:object="${vehicle}" novalidate>
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                            <div class="row g-3">
                                <div class="col-12">
                                    <label class="form-label text-muted small fw-semibold">REGISTRATION NUMBER *</label>
                                    <input type="text" class="form-control"
                                           th:field="*{registrationNumber}"
                                           th:class="${#fields.hasErrors('registrationNumber')} ? 'form-control is-invalid' : 'form-control'"
                                           placeholder="e.g., TN 01 AB 1234"
                                           style="text-transform:uppercase">
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('registrationNumber')}"
                                         th:errors="*{registrationNumber}"></div>
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label text-muted small fw-semibold">BRAND / MAKE *</label>
                                    <input type="text" class="form-control"
                                           th:field="*{brand}"
                                           th:class="${#fields.hasErrors('brand')} ? 'form-control is-invalid' : 'form-control'"
                                           placeholder="e.g., Toyota, Honda, BMW"
                                           list="brandList">
                                    <datalist id="brandList">
                                        <option>Toyota</option><option>Honda</option><option>Hyundai</option>
                                        <option>Maruti Suzuki</option><option>Tata</option><option>Ford</option>
                                        <option>BMW</option><option>Audi</option><option>Mercedes-Benz</option>
                                        <option>Volkswagen</option><option>Kia</option><option>MG</option>
                                    </datalist>
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('brand')}"
                                         th:errors="*{brand}"></div>
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label text-muted small fw-semibold">MODEL *</label>
                                    <input type="text" class="form-control"
                                           th:field="*{model}"
                                           th:class="${#fields.hasErrors('model')} ? 'form-control is-invalid' : 'form-control'"
                                           placeholder="e.g., Corolla, Civic, Creta">
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('model')}"
                                         th:errors="*{model}"></div>
                                </div>

                                <div class="col-md-4">
                                    <label class="form-label text-muted small fw-semibold">YEAR *</label>
                                    <input type="number" class="form-control"
                                           th:field="*{year}"
                                           th:class="${#fields.hasErrors('year')} ? 'form-control is-invalid' : 'form-control'"
                                           placeholder="e.g., 2020" min="1990" max="2030">
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('year')}"
                                         th:errors="*{year}"></div>
                                </div>

                                <div class="col-md-4">
                                    <label class="form-label text-muted small fw-semibold">FUEL TYPE *</label>
                                    <select class="form-select" th:field="*{fuelType}"
                                            th:class="${#fields.hasErrors('fuelType')} ? 'form-select is-invalid' : 'form-select'">
                                        <option value="">Select fuel type</option>
                                        <option value="Petrol">Petrol</option>
                                        <option value="Diesel">Diesel</option>
                                        <option value="CNG">CNG</option>
                                        <option value="Electric">Electric</option>
                                        <option value="Hybrid">Hybrid</option>
                                        <option value="LPG">LPG</option>
                                    </select>
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('fuelType')}"
                                         th:errors="*{fuelType}"></div>
                                </div>

                                <div class="col-md-4">
                                    <label class="form-label text-muted small fw-semibold">TRANSMISSION</label>
                                    <select class="form-select" th:field="*{transmission}">
                                        <option value="">Select</option>
                                        <option value="Manual">Manual</option>
                                        <option value="Automatic">Automatic</option>
                                        <option value="CVT">CVT</option>
                                        <option value="AMT">AMT</option>
                                        <option value="DCT">DCT</option>
                                    </select>
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label text-muted small fw-semibold">COLOR</label>
                                    <input type="text" class="form-control" th:field="*{color}"
                                           placeholder="e.g., Pearl White, Midnight Black">
                                </div>

                                <div class="col-12 mt-3 d-flex gap-3">
                                    <button type="submit" class="btn btn-warning px-4">
                                        <i class="bi bi-check-circle me-2"></i>
                                        <span th:text="${isEdit} ? 'Update Vehicle' : 'Add Vehicle'">Save</span>
                                    </button>
                                    <a th:href="@{/customer/vehicles}" class="btn btn-outline-secondary px-4">
                                        <i class="bi bi-x-circle me-2"></i>Cancel
                                    </a>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
