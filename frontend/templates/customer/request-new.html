<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Modification Request - CarModPro</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="stylesheet" th:href="@{/css/customer.css}">
</head>
<body class="customer-page">
<div th:replace="~{fragments/layout :: customerNav('requests')}"></div>
<div class="customer-content">
    <div class="container-fluid px-4 py-4">
        <div th:replace="~{fragments/navbar :: alerts}"></div>

        <div class="d-flex align-items-center mb-4 gap-3">
            <a th:href="@{/customer/requests}" class="btn btn-sm btn-outline-secondary">
                <i class="bi bi-arrow-left"></i>
            </a>
            <div>
                <h4 class="text-white mb-0">New Modification Request</h4>
                <p class="text-muted small mb-0">Select a vehicle and choose services to modify</p>
            </div>
        </div>

        <div th:if="${errorMessage}" class="alert alert-danger d-flex align-items-center mb-3">
            <i class="bi bi-exclamation-triangle-fill me-2"></i>
            <span th:text="${errorMessage}"></span>
        </div>

        <form th:action="@{/customer/requests/new}" method="post"
              th:object="${requestDto}" id="requestForm" novalidate>
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

            <div class="row g-4">
                <!-- Left: Vehicle + Notes -->
                <div class="col-lg-4">
                    <div class="content-card mb-4">
                        <div class="content-card-header">
                            <h6 class="text-white mb-0"><i class="bi bi-car-front me-2 text-warning"></i>Select Vehicle *</h6>
                        </div>
                        <div class="content-card-body">
                            <div th:if="${#fields.hasErrors('vehicleId')}" class="text-danger small mb-2"
                                 th:errors="*{vehicleId}"></div>
                            <div th:each="v : ${vehicles}" class="vehicle-select-option mb-2">
                                <input type="radio" class="btn-check" th:field="*{vehicleId}"
                                       th:id="${'veh_' + v.id}" th:value="${v.id}">
                                <label class="vehicle-select-label w-100" th:for="${'veh_' + v.id}">
                                    <div class="d-flex align-items-center gap-2">
                                        <i class="bi bi-car-front text-warning fs-5"></i>
                                        <div>
                                            <strong class="text-white small" th:text="${v.brand + ' ' + v.model}"></strong>
                                            <span class="d-block text-muted" style="font-size:11px"
                                                  th:text="${v.registrationNumber + ' • ' + v.year}"></span>
                                        </div>
                                    </div>
                                </label>
                            </div>
                        </div>
                    </div>

                    <div class="content-card mb-4">
                        <div class="content-card-header">
                            <h6 class="text-white mb-0"><i class="bi bi-chat-dots me-2 text-warning"></i>Additional Notes</h6>
                        </div>
                        <div class="content-card-body">
                            <textarea class="form-control" th:field="*{customerNotes}"
                                      rows="4" placeholder="Any specific requirements, existing damage, or preferences..."></textarea>
                        </div>
                    </div>

                    <!-- Cost Estimate Preview -->
                    <div class="content-card" id="estimateCard" style="display:none">
                        <div class="content-card-header">
                            <h6 class="text-white mb-0"><i class="bi bi-calculator me-2 text-warning"></i>Cost Estimate</h6>
                        </div>
                        <div class="content-card-body">
                            <div id="selectedServicesList"></div>
                            <hr class="border-secondary">
                            <div class="d-flex justify-content-between align-items-center">
                                <span class="text-muted">Estimated Total:</span>
                                <span class="fs-5 fw-bold text-warning" id="totalEstimate">₹0</span>
                            </div>
                            <p class="text-muted" style="font-size:10px;margin-top:4px">* Final cost may vary based on inspection</p>
                        </div>
                    </div>
                </div>

                <!-- Right: Services Selection -->
                <div class="col-lg-8">
                    <div th:if="${#fields.hasErrors('serviceIds')}" class="alert alert-warning">
                        <i class="bi bi-exclamation-triangle me-2"></i>
                        Please select at least one service.
                    </div>

                    <div th:each="cat : ${categories}" class="content-card mb-3">
                        <div class="content-card-header">
                            <h6 class="text-white mb-0">
                                <i th:class="${'bi ' + (cat.iconClass ?: 'bi-tools')} + ' me-2 text-warning'"></i>
                                <span th:text="${cat.name}">Category</span>
                            </h6>
                        </div>
                        <div class="content-card-body">
                            <div class="row g-2">
                                <div th:each="svc : ${cat.services}" th:if="${svc.available}" class="col-md-6">
                                    <div class="service-select-card" th:id="${'card_' + svc.id}">
                                        <div class="form-check d-flex gap-3 align-items-start">
                                            <input class="form-check-input service-checkbox mt-1"
                                                   type="checkbox"
                                                   name="serviceIds"
                                                   th:id="${'svc_' + svc.id}"
                                                   th:value="${svc.id}"
                                                   th:data-price="${svc.basePrice}"
                                                   th:data-name="${svc.name}"
                                                   onchange="updateEstimate(this)">
                                            <label class="form-check-label w-100" th:for="${'svc_' + svc.id}">
                                                <strong class="text-white small" th:text="${svc.name}"></strong>
                                                <span class="d-block text-muted" style="font-size:11px"
                                                      th:text="${#strings.abbreviate(svc.description, 60)}"></span>
                                                <span class="d-block text-warning fw-semibold small mt-1">
                                                    ₹<span th:text="${#numbers.formatDecimal(svc.basePrice, 0, 'COMMA', 0, 'POINT')}"></span>
                                                    <small class="text-muted fw-normal" th:if="${svc.duration}"
                                                           th:text="${' • ' + svc.duration}"></small>
                                                </span>
                                            </label>
                                        </div>
                                    </div>
                                </div>
                                <div th:if="${#lists.isEmpty(cat.services)}" class="col-12">
                                    <p class="text-muted small mb-0">No services available in this category.</p>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="d-flex gap-3 mt-3">
                        <button type="submit" class="btn btn-warning px-5 fw-semibold">
                            <i class="bi bi-send me-2"></i>Submit Request
                        </button>
                        <a th:href="@{/customer/requests}" class="btn btn-outline-secondary px-4">
                            Cancel
                        </a>
                    </div>
                </div>
            </div>
        </form>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
const selectedServices = {};

function updateEstimate(checkbox) {
    const serviceId = checkbox.value;
    const price = parseFloat(checkbox.dataset.price);
    const name = checkbox.dataset.name;

    if (checkbox.checked) {
        selectedServices[serviceId] = { name, price };
        document.getElementById('card_' + serviceId).classList.add('selected');
    } else {
        delete selectedServices[serviceId];
        document.getElementById('card_' + serviceId).classList.remove('selected');
    }

    const keys = Object.keys(selectedServices);
    if (keys.length === 0) {
        document.getElementById('estimateCard').style.display = 'none';
        return;
    }

    document.getElementById('estimateCard').style.display = 'block';
    let total = 0;
    let listHtml = '';
    for (const id in selectedServices) {
        const svc = selectedServices[id];
        total += svc.price;
        listHtml += `<div class="d-flex justify-content-between mb-1">
            <span class="text-muted small">${svc.name}</span>
            <span class="text-white small">₹${svc.price.toLocaleString('en-IN')}</span>
        </div>`;
    }
    document.getElementById('selectedServicesList').innerHTML = listHtml;
    document.getElementById('totalEstimate').textContent = '₹' + total.toLocaleString('en-IN');
}
</script>
</body>
</html>
