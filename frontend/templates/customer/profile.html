<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - CarModPro</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="stylesheet" th:href="@{/css/customer.css}">
</head>
<body class="customer-page">
<div th:replace="~{fragments/layout :: customerNav('profile')}"></div>
<div class="customer-content">
    <div class="container-fluid px-4 py-4">
        <div th:replace="~{fragments/navbar :: alerts}"></div>

        <div class="row g-4">
            <div class="col-lg-8">
                <div class="content-card">
                    <div class="content-card-header">
                        <h5 class="text-white mb-0"><i class="bi bi-person me-2 text-warning"></i>My Profile</h5>
                    </div>
                    <div class="content-card-body">
                        <div th:if="${errorMessage}" class="alert alert-danger d-flex align-items-center mb-3">
                            <i class="bi bi-exclamation-triangle-fill me-2"></i>
                            <span th:text="${errorMessage}"></span>
                        </div>

                        <form th:action="@{/customer/profile}" method="post"
                              th:object="${profileDto}" novalidate>
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label class="form-label text-muted small fw-semibold">FULL NAME *</label>
                                    <input type="text" class="form-control"
                                           th:field="*{fullName}"
                                           th:class="${#fields.hasErrors('fullName')} ? 'form-control is-invalid' : 'form-control'"
                                           placeholder="Your full name">
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('fullName')}"
                                         th:errors="*{fullName}"></div>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label text-muted small fw-semibold">PHONE</label>
                                    <input type="tel" class="form-control"
                                           th:field="*{phone}"
                                           th:class="${#fields.hasErrors('phone')} ? 'form-control is-invalid' : 'form-control'"
                                           placeholder="+91 98765 43210">
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('phone')}"
                                         th:errors="*{phone}"></div>
                                </div>
                                <div class="col-12">
                                    <label class="form-label text-muted small fw-semibold">EMAIL ADDRESS *</label>
                                    <input type="email" class="form-control"
                                           th:field="*{email}"
                                           th:class="${#fields.hasErrors('email')} ? 'form-control is-invalid' : 'form-control'"
                                           placeholder="your@email.com">
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}"
                                         th:errors="*{email}"></div>
                                </div>

                                <div class="col-12">
                                    <hr class="border-secondary">
                                    <h6 class="text-muted small fw-semibold mb-3">CHANGE PASSWORD (leave blank to keep current)</h6>
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label text-muted small fw-semibold">NEW PASSWORD</label>
                                    <input type="password" class="form-control"
                                           th:field="*{newPassword}"
                                           placeholder="Min 8 characters">
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('newPassword')}"
                                         th:errors="*{newPassword}"></div>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label text-muted small fw-semibold">CONFIRM NEW PASSWORD</label>
                                    <input type="password" class="form-control"
                                           th:field="*{confirmNewPassword}"
                                           placeholder="Re-enter new password">
                                </div>

                                <div class="col-12 mt-2">
                                    <button type="submit" class="btn btn-warning px-4">
                                        <i class="bi bi-check-circle me-2"></i>Save Changes
                                    </button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

            <div class="col-lg-4">
                <div class="content-card">
                    <div class="content-card-header">
                        <h6 class="text-white mb-0"><i class="bi bi-info-circle me-2 text-warning"></i>Account Info</h6>
                    </div>
                    <div class="content-card-body">
                        <div class="text-center mb-4">
                            <div class="profile-avatar mx-auto mb-3">
                                <i class="bi bi-person-fill fs-1 text-warning"></i>
                            </div>
                            <h6 class="text-white" th:text="${user.fullName}"></h6>
                            <p class="text-muted small" th:text="${user.email}"></p>
                            <span class="badge bg-warning text-dark">Customer</span>
                        </div>
                        <div class="vehicle-detail-row">
                            <span class="text-muted small">Account Status</span>
                            <span class="badge" th:classappend="${user.status.name() == 'ACTIVE'} ? 'bg-success' : 'bg-danger'"
                                  th:text="${user.status}"></span>
                        </div>
                        <div class="vehicle-detail-row">
                            <span class="text-muted small">Member Since</span>
                            <span class="text-white small"
                                  th:text="${#temporals.format(user.createdAt, 'MMMM yyyy')}"></span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
