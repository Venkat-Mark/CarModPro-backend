<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Vehicles - CarModPro</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="stylesheet" th:href="@{/css/customer.css}">
</head>
<body class="customer-page">
<div th:replace="~{fragments/layout :: customerNav('vehicles')}"></div>
<div class="customer-content">
    <div class="container-fluid px-4 py-4">
        <div th:replace="~{fragments/navbar :: alerts}"></div>

        <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
            <div>
                <h4 class="text-white mb-1"><i class="bi bi-car-front me-2 text-warning"></i>My Vehicles</h4>
                <p class="text-muted small mb-0">Manage your registered vehicles</p>
            </div>
            <a th:href="@{/customer/vehicles/add}" class="btn btn-warning">
                <i class="bi bi-plus-circle me-2"></i>Add New Vehicle
            </a>
        </div>

        <!-- Search -->
        <div class="content-card mb-4">
            <div class="content-card-body">
                <form th:action="@{/customer/vehicles}" method="get" class="d-flex gap-2">
                    <div class="input-group">
                        <span class="input-group-text bg-transparent border-secondary text-muted">
                            <i class="bi bi-search"></i>
                        </span>
                        <input type="text" class="form-control" name="search"
                               th:value="${searchQuery}"
                               placeholder="Search by brand, model, or registration...">
                        <button type="submit" class="btn btn-warning">Search</button>
                        <a th:if="${searchQuery}" th:href="@{/customer/vehicles}" class="btn btn-outline-secondary">Clear</a>
                    </div>
                </form>
            </div>
        </div>

        <!-- Vehicles Grid -->
        <div th:if="${#lists.isEmpty(vehicles)}" class="content-card">
            <div class="content-card-body">
                <div class="empty-state py-5 text-center">
                    <i class="bi bi-car-front fs-1 text-muted"></i>
                    <h5 class="text-white mt-3">No Vehicles Found</h5>
                    <p class="text-muted">
                        <span th:if="${searchQuery}">No vehicles matched "<strong th:text="${searchQuery}"></strong>".</span>
                        <span th:unless="${searchQuery}">You haven't registered any vehicles yet.</span>
                    </p>
                    <a th:href="@{/customer/vehicles/add}" class="btn btn-warning">
                        <i class="bi bi-plus-circle me-2"></i>Add Your First Vehicle
                    </a>
                </div>
            </div>
        </div>

        <div class="row g-4" th:if="${!#lists.isEmpty(vehicles)}">
            <div th:each="v : ${vehicles}" class="col-lg-4 col-md-6">
                <div class="vehicle-card">
                    <div class="vehicle-card-header">
                        <div class="vehicle-icon-bg">
                            <i class="bi bi-car-front-fill fs-2 text-warning"></i>
                        </div>
                        <div class="ms-3">
                            <h6 class="text-white mb-0" th:text="${v.brand + ' ' + v.model}"></h6>
                            <small class="text-muted" th:text="${v.year + ' • ' + v.fuelType}"></small>
                        </div>
                    </div>
                    <div class="vehicle-card-body">
                        <div class="vehicle-detail-row">
                            <span class="text-muted small"><i class="bi bi-card-text me-2"></i>Registration</span>
                            <span class="text-warning fw-semibold small" th:text="${v.registrationNumber}"></span>
                        </div>
                        <div class="vehicle-detail-row" th:if="${v.color}">
                            <span class="text-muted small"><i class="bi bi-palette me-2"></i>Color</span>
                            <span class="text-white small" th:text="${v.color}"></span>
                        </div>
                        <div class="vehicle-detail-row" th:if="${v.transmission}">
                            <span class="text-muted small"><i class="bi bi-gear me-2"></i>Transmission</span>
                            <span class="text-white small" th:text="${v.transmission}"></span>
                        </div>
                        <div class="vehicle-detail-row">
                            <span class="text-muted small"><i class="bi bi-calendar3 me-2"></i>Added</span>
                            <span class="text-white small" th:text="${#temporals.format(v.createdAt, 'dd MMM yyyy')}"></span>
                        </div>
                    </div>
                    <div class="vehicle-card-footer">
                        <a th:href="@{/customer/vehicles/edit/{id}(id=${v.id})}"
                           class="btn btn-sm btn-outline-warning">
                            <i class="bi bi-pencil me-1"></i>Edit
                        </a>
                        <form th:action="@{/customer/vehicles/delete/{id}(id=${v.id})}"
                              method="post" class="d-inline"
                              onsubmit="return confirm('Are you sure you want to remove this vehicle?')">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <button type="submit" class="btn btn-sm btn-outline-danger">
                                <i class="bi bi-trash me-1"></i>Remove
                            </button>
                        </form>
                        <a th:href="@{/customer/requests/new}" class="btn btn-sm btn-warning">
                            <i class="bi bi-tools me-1"></i>Modify
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
