<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>500 - Server Error | CarModPro</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/css/main.css">
</head>
<body class="auth-page">
<div class="auth-bg-overlay"></div>
<div class="container min-vh-100 d-flex align-items-center justify-content-center text-center">
    <div class="auth-card" style="max-width: 500px;">
        <div class="mb-4">
            <i class="bi bi-exclamation-octagon-fill text-danger display-1"></i>
        </div>
        <h1 class="display-4 fw-bold text-white mb-2">500</h1>
        <h4 class="text-danger mb-3">Internal Server Error</h4>
        <p class="text-muted mb-4" th:text="${errorMessage ?: 'An internal server error occurred while processing your request. Our technical staff has been notified.'}">
            Something went wrong while processing your request. Please try again.
        </p>
        <div class="d-flex justify-content-center gap-3">
            <a href="/" class="btn btn-warning px-4 fw-semibold">
                <i class="bi bi-house-door me-1"></i>Back to Home
            </a>
            <button onclick="window.location.reload();" class="btn btn-outline-light px-4">
                <i class="bi bi-arrow-clockwise me-1"></i>Reload Page
            </button>
        </div>
    </div>
</div>
</body>
</html>
