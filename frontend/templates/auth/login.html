<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - CarModPro</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body class="auth-page">
<div class="auth-bg-overlay"></div>

<div class="container-fluid vh-100 d-flex align-items-center justify-content-center">
    <div class="auth-card">
        <div class="auth-header text-center mb-4">
            <a href="/" class="text-decoration-none">
                <div class="auth-logo mb-3">
                    <i class="bi bi-gear-fill text-warning fs-2"></i>
                </div>
                <h4 class="text-white fw-bold">CarMod<span class="text-warning">Pro</span></h4>
            </a>
            <p class="text-muted small">Sign in to your account</p>
        </div>

        <!-- Alerts -->
        <div th:if="${errorMessage}" class="alert alert-danger alert-sm d-flex align-items-center" role="alert">
            <i class="bi bi-exclamation-triangle-fill me-2"></i>
            <span th:text="${errorMessage}"></span>
        </div>
        <div th:if="${successMessage}" class="alert alert-success alert-sm d-flex align-items-center" role="alert">
            <i class="bi bi-check-circle-fill me-2"></i>
            <span th:text="${successMessage}"></span>
        </div>
        <div th:if="${logoutMessage}" class="alert alert-info alert-sm d-flex align-items-center" role="alert">
            <i class="bi bi-info-circle-fill me-2"></i>
            <span th:text="${logoutMessage}"></span>
        </div>

        <form th:action="@{/login}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

            <div class="mb-3">
                <label class="form-label text-muted small fw-semibold">EMAIL ADDRESS</label>
                <div class="input-group">
                    <span class="input-group-text auth-input-icon"><i class="bi bi-envelope"></i></span>
                    <input type="email" class="form-control auth-input" name="email"
                           placeholder="you@example.com" required autocomplete="email">
                </div>
            </div>

            <div class="mb-4">
                <div class="d-flex justify-content-between align-items-center">
                    <label class="form-label text-muted small fw-semibold mb-0">PASSWORD</label>
                </div>
                <div class="input-group mt-1">
                    <span class="input-group-text auth-input-icon"><i class="bi bi-lock"></i></span>
                    <input type="password" class="form-control auth-input" name="password"
                           id="passwordField" placeholder="••••••••" required autocomplete="current-password">
                    <button class="btn auth-input-icon border-0 px-3" type="button" onclick="togglePassword('passwordField', this)">
                        <i class="bi bi-eye"></i>
                    </button>
                </div>
            </div>

            <button type="submit" class="btn btn-warning w-100 fw-semibold py-2">
                <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
            </button>
        </form>

        <div class="text-center mt-4">
            <p class="text-muted small">Don't have an account?
                <a th:href="@{/register}" class="text-warning fw-semibold text-decoration-none">Create one free</a>
            </p>
            <a th:href="@{/}" class="text-muted small text-decoration-none">
                <i class="bi bi-arrow-left me-1"></i>Back to Home
            </a>
        </div>

        <!-- Demo credentials -->
        <div class="mt-4 demo-credentials">
            <p class="text-muted small text-center mb-2 fw-semibold">DEMO CREDENTIALS</p>
            <div class="row g-2">
                <div class="col-6">
                    <div class="demo-cred-box" onclick="fillCredentials('admin@carmod.com', 'Admin@1234')">
                        <i class="bi bi-shield-fill text-warning"></i>
                        <span class="d-block small text-white">Admin</span>
                        <span class="d-block" style="font-size:10px;color:#888;">Click to fill</span>
                    </div>
                </div>
                <div class="col-6">
                    <div class="demo-cred-box" onclick="fillCredentials('customer@test.com', 'Customer@1234')">
                        <i class="bi bi-person-fill text-info"></i>
                        <span class="d-block small text-white">Customer</span>
                        <span class="d-block" style="font-size:10px;color:#888;">Register first</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
function togglePassword(fieldId, btn) {
    const field = document.getElementById(fieldId);
    const icon = btn.querySelector('i');
    if (field.type === 'password') {
        field.type = 'text';
        icon.className = 'bi bi-eye-slash';
    } else {
        field.type = 'password';
        icon.className = 'bi bi-eye';
    }
}
function fillCredentials(email, password) {
    document.querySelector('input[name="email"]').value = email;
    document.getElementById('passwordField').value = password;
}
</script>
</body>
</html>
