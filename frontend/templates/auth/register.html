<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - CarModPro</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body class="auth-page">
<div class="auth-bg-overlay"></div>

<div class="container py-5 d-flex align-items-center justify-content-center min-vh-100">
    <div class="auth-card auth-card-wide">
        <div class="auth-header text-center mb-4">
            <a href="/" class="text-decoration-none">
                <div class="auth-logo mb-3">
                    <i class="bi bi-gear-fill text-warning fs-2"></i>
                </div>
                <h4 class="text-white fw-bold">CarMod<span class="text-warning">Pro</span></h4>
            </a>
            <p class="text-muted small">Create your free account</p>
        </div>

        <!-- Alerts -->
        <div th:if="${errorMessage}" class="alert alert-danger d-flex align-items-center" role="alert">
            <i class="bi bi-exclamation-triangle-fill me-2"></i>
            <span th:text="${errorMessage}"></span>
        </div>

        <form th:action="@{/register}" method="post" th:object="${user}" novalidate>
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

            <div class="row g-3">
                <div class="col-12">
                    <label class="form-label text-muted small fw-semibold">FULL NAME *</label>
                    <div class="input-group">
                        <span class="input-group-text auth-input-icon"><i class="bi bi-person"></i></span>
                        <input type="text" class="form-control auth-input"
                               th:field="*{fullName}"
                               th:class="${#fields.hasErrors('fullName')} ? 'form-control auth-input is-invalid' : 'form-control auth-input'"
                               placeholder="John Doe" required>
                    </div>
                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('fullName')}"
                         th:errors="*{fullName}"></div>
                </div>

                <div class="col-md-6">
                    <label class="form-label text-muted small fw-semibold">EMAIL ADDRESS *</label>
                    <div class="input-group">
                        <span class="input-group-text auth-input-icon"><i class="bi bi-envelope"></i></span>
                        <input type="email" class="form-control auth-input"
                               th:field="*{email}"
                               th:class="${#fields.hasErrors('email')} ? 'form-control auth-input is-invalid' : 'form-control auth-input'"
                               placeholder="you@example.com" required>
                    </div>
                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('email')}"
                         th:errors="*{email}"></div>
                </div>

                <div class="col-md-6">
                    <label class="form-label text-muted small fw-semibold">PHONE NUMBER</label>
                    <div class="input-group">
                        <span class="input-group-text auth-input-icon"><i class="bi bi-telephone"></i></span>
                        <input type="tel" class="form-control auth-input"
                               th:field="*{phone}"
                               th:class="${#fields.hasErrors('phone')} ? 'form-control auth-input is-invalid' : 'form-control auth-input'"
                               placeholder="+91 98765 43210">
                    </div>
                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('phone')}"
                         th:errors="*{phone}"></div>
                </div>

                <div class="col-md-6">
                    <label class="form-label text-muted small fw-semibold">PASSWORD *</label>
                    <div class="input-group">
                        <span class="input-group-text auth-input-icon"><i class="bi bi-lock"></i></span>
                        <input type="password" class="form-control auth-input"
                               th:field="*{password}" id="password"
                               th:class="${#fields.hasErrors('password')} ? 'form-control auth-input is-invalid' : 'form-control auth-input'"
                               placeholder="Min 8 chars, upper+lower+number" required>
                        <button class="btn auth-input-icon border-0 px-3" type="button"
                                onclick="togglePassword('password', this)">
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>
                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('password')}"
                         th:errors="*{password}"></div>
                </div>

                <div class="col-md-6">
                    <label class="form-label text-muted small fw-semibold">CONFIRM PASSWORD *</label>
                    <div class="input-group">
                        <span class="input-group-text auth-input-icon"><i class="bi bi-lock-fill"></i></span>
                        <input type="password" class="form-control auth-input"
                               th:field="*{confirmPassword}" id="confirmPassword"
                               th:class="${passwordError} ? 'form-control auth-input is-invalid' : 'form-control auth-input'"
                               placeholder="Re-enter password" required>
                        <button class="btn auth-input-icon border-0 px-3" type="button"
                                onclick="togglePassword('confirmPassword', this)">
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>
                    <div class="text-danger small mt-1" th:if="${passwordError}" th:text="${passwordError}"></div>
                </div>

                <div class="col-12">
                    <div class="password-strength" id="strengthIndicator" style="display:none">
                        <div class="progress" style="height:4px">
                            <div class="progress-bar" id="strengthBar" role="progressbar"></div>
                        </div>
                        <small id="strengthText" class="text-muted"></small>
                    </div>
                </div>

                <div class="col-12 mt-2">
                    <button type="submit" class="btn btn-warning w-100 fw-semibold py-2">
                        <i class="bi bi-person-check me-2"></i>Create Account
                    </button>
                </div>
            </div>
        </form>

        <div class="text-center mt-4">
            <p class="text-muted small">Already have an account?
                <a th:href="@{/login}" class="text-warning fw-semibold text-decoration-none">Sign in</a>
            </p>
            <a th:href="@{/}" class="text-muted small text-decoration-none">
                <i class="bi bi-arrow-left me-1"></i>Back to Home
            </a>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
function togglePassword(fieldId, btn) {
    const field = document.getElementById(fieldId);
    const icon = btn.querySelector('i');
    if (field.type === 'password') { field.type = 'text'; icon.className = 'bi bi-eye-slash'; }
    else { field.type = 'password'; icon.className = 'bi bi-eye'; }
}

document.getElementById('password').addEventListener('input', function() {
    const val = this.value;
    const indicator = document.getElementById('strengthIndicator');
    const bar = document.getElementById('strengthBar');
    const text = document.getElementById('strengthText');
    if (!val) { indicator.style.display = 'none'; return; }
    indicator.style.display = 'block';
    let score = 0;
    if (val.length >= 8) score++;
    if (/[A-Z]/.test(val)) score++;
    if (/[a-z]/.test(val)) score++;
    if (/[0-9]/.test(val)) score++;
    if (/[^A-Za-z0-9]/.test(val)) score++;
    const pct = (score / 5) * 100;
    bar.style.width = pct + '%';
    bar.className = 'progress-bar ' + (score <= 2 ? 'bg-danger' : score <= 3 ? 'bg-warning' : 'bg-success');
    text.textContent = ['', 'Very Weak', 'Weak', 'Fair', 'Strong', 'Very Strong'][score];
});
</script>
</body>
</html>
