<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<!-- ============================================================
     ADMIN SIDEBAR FRAGMENT
     ============================================================ -->
<aside th:fragment="adminSidebar(activePage)" class="admin-sidebar" id="adminSidebar">
    <div class="sidebar-brand">
        <i class="bi bi-gear-fill text-warning fs-4"></i>
        <span class="ms-2 fw-bold">CarMod<span class="text-warning">Pro</span></span>
    </div>

    <nav class="sidebar-nav mt-3">
        <div class="sidebar-section-label">MAIN</div>
        <a th:href="@{/admin/dashboard}"
           th:class="${activePage == 'dashboard'} ? 'sidebar-link active' : 'sidebar-link'">
            <i class="bi bi-speedometer2"></i>
            <span>Dashboard</span>
        </a>

        <div class="sidebar-section-label mt-3">MANAGEMENT</div>
        <a th:href="@{/admin/requests}"
           th:class="${activePage == 'requests'} ? 'sidebar-link active' : 'sidebar-link'">
            <i class="bi bi-list-task"></i>
            <span>Modification Requests</span>
        </a>
        <a th:href="@{/admin/customers}"
           th:class="${activePage == 'customers'} ? 'sidebar-link active' : 'sidebar-link'">
            <i class="bi bi-people-fill"></i>
            <span>Customers</span>
        </a>
        <a th:href="@{/admin/vehicles}"
           th:class="${activePage == 'vehicles'} ? 'sidebar-link active' : 'sidebar-link'">
            <i class="bi bi-car-front-fill"></i>
            <span>Vehicles</span>
        </a>

        <div class="sidebar-section-label mt-3">CATALOG</div>
        <a th:href="@{/admin/services}"
           th:class="${activePage == 'services'} ? 'sidebar-link active' : 'sidebar-link'">
            <i class="bi bi-tools"></i>
            <span>Services</span>
        </a>
        <a th:href="@{/admin/categories}"
           th:class="${activePage == 'categories'} ? 'sidebar-link active' : 'sidebar-link'">
            <i class="bi bi-grid-3x3-gap-fill"></i>
            <span>Categories</span>
        </a>
        <a th:href="@{/admin/feedback}"
           th:class="${activePage == 'feedback'} ? 'sidebar-link active' : 'sidebar-link'">
            <i class="bi bi-star-fill"></i>
            <span>Feedback &amp; Ratings</span>
        </a>

        <div class="sidebar-section-label mt-3">ACCOUNT</div>
        <a th:href="@{/logout}" class="sidebar-link text-danger-emphasis">
            <i class="bi bi-box-arrow-right"></i>
            <span>Logout</span>
        </a>
    </nav>
</aside>

<!-- ============================================================
     ADMIN TOP BAR FRAGMENT
     ============================================================ -->
<header th:fragment="adminTopbar(pageTitle)" class="admin-topbar">
    <div class="d-flex align-items-center gap-3">
        <button class="btn btn-sm btn-outline-secondary" id="sidebarToggle">
            <i class="bi bi-list fs-5"></i>
        </button>
        <h5 class="mb-0 fw-semibold" th:text="${pageTitle}">Dashboard</h5>
    </div>
    <div class="d-flex align-items-center gap-3">
        <div class="topbar-badge">
            <i class="bi bi-bell"></i>
        </div>
        <div class="dropdown">
            <button class="btn btn-sm d-flex align-items-center gap-2 topbar-user" data-bs-toggle="dropdown">
                <div class="topbar-avatar">
                    <i class="bi bi-shield-fill text-warning"></i>
                </div>
                <span sec:authentication="name" class="d-none d-md-inline small fw-semibold">Admin</span>
                <i class="bi bi-chevron-down small"></i>
            </button>
            <ul class="dropdown-menu dropdown-menu-end shadow">
                <li><h6 class="dropdown-header">Administrator</h6></li>
                <li><hr class="dropdown-divider"></li>
                <li>
                    <a class="dropdown-item" th:href="@{/logout}">
                        <i class="bi bi-box-arrow-right me-2 text-danger"></i>Logout
                    </a>
                </li>
            </ul>
        </div>
    </div>
</header>

<!-- ============================================================
     CUSTOMER NAVBAR FRAGMENT
     ============================================================ -->
<nav th:fragment="customerNav(activePage)" class="navbar navbar-expand-lg navbar-dark" id="mainNav">
    <div class="container-fluid px-4">
        <a class="navbar-brand" th:href="@{/}">
            <i class="bi bi-gear-fill text-warning"></i>
            CarMod<span class="text-warning">Pro</span>
        </a>
        <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#custNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="custNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/customer/dashboard}"
                       th:classappend="${activePage == 'dashboard'} ? ' active' : ''">
                        <i class="bi bi-speedometer2 me-1"></i>Dashboard
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/customer/vehicles}"
                       th:classappend="${activePage == 'vehicles'} ? ' active' : ''">
                        <i class="bi bi-car-front me-1"></i>My Vehicles
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/customer/requests}"
                       th:classappend="${activePage == 'requests'} ? ' active' : ''">
                        <i class="bi bi-list-task me-1"></i>My Requests
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/services}"
                       th:classappend="${activePage == 'services'} ? ' active' : ''">
                        <i class="bi bi-tools me-1"></i>Browse Services
                    </a>
                </li>
            </ul>
            <div class="d-flex align-items-center gap-2">
                <div class="dropdown">
                    <button class="btn btn-sm d-flex align-items-center gap-2 topbar-user" data-bs-toggle="dropdown">
                        <i class="bi bi-person-circle fs-5 text-warning"></i>
                        <span sec:authentication="name" class="d-none d-md-inline small fw-semibold text-white"></span>
                        <i class="bi bi-chevron-down small text-white"></i>
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end shadow">
                        <li>
                            <a class="dropdown-item" th:href="@{/customer/profile}">
                                <i class="bi bi-person me-2"></i>My Profile
                            </a>
                        </li>
                        <li><hr class="dropdown-divider"></li>
                        <li>
                            <a class="dropdown-item text-danger" th:href="@{/logout}">
                                <i class="bi bi-box-arrow-right me-2"></i>Logout
                            </a>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </div>
</nav>

<!-- ============================================================
     PAGINATION FRAGMENT
     ============================================================ -->
<nav th:fragment="pagination(currentPage, totalPages, baseUrl)" aria-label="Page navigation" th:if="${totalPages > 1}">
    <ul class="pagination justify-content-center">
        <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled' : ''">
            <a class="page-link" th:href="${baseUrl + '?page=' + (currentPage - 1)}">
                <i class="bi bi-chevron-left"></i>
            </a>
        </li>
        <li th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
            class="page-item" th:classappend="${i == currentPage} ? 'active' : ''">
            <a class="page-link" th:href="${baseUrl + '?page=' + i}" th:text="${i + 1}"></a>
        </li>
        <li class="page-item" th:classappend="${currentPage == totalPages - 1} ? 'disabled' : ''">
            <a class="page-link" th:href="${baseUrl + '?page=' + (currentPage + 1)}">
                <i class="bi bi-chevron-right"></i>
            </a>
        </li>
    </ul>
</nav>

</html>
