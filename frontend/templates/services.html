<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modification Services - CarModPro</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body class="public-page">

<!-- Navbar -->
<div th:replace="~{fragments/navbar :: publicNav}"></div>

<!-- Page Header -->
<section class="page-header py-5">
    <div class="container text-center">
        <h1 class="text-white fw-bold mb-2">Our <span class="text-warning">Modification Services</span></h1>
        <p class="text-muted">Explore high-performance upgrades, bespoke interiors, aesthetic styling, and audio systems</p>
    </div>
</section>

<!-- Filter & Search Bar -->
<section class="py-4 section-darker border-bottom border-secondary">
    <div class="container">
        <form th:action="@{/services}" method="get" class="row g-3 align-items-center">
            <div class="col-lg-6 col-md-5">
                <div class="input-group">
                    <span class="input-group-text bg-dark border-secondary text-warning">
                        <i class="bi bi-search"></i>
                    </span>
                    <input type="text" class="form-control" name="search"
                           th:value="${searchQuery}"
                           placeholder="Search modifications (e.g. Paint, Exhaust, LED, Leather)...">
                </div>
            </div>
            <div class="col-lg-4 col-md-4">
                <select class="form-select" name="category" onchange="this.form.submit()">
                    <option value="">All Categories</option>
                    <option th:each="cat : ${categories}"
                            th:value="${cat.id}"
                            th:text="${cat.name}"
                            th:selected="${selectedCategory != null && selectedCategory == cat.id}">
                    </option>
                </select>
            </div>
            <div class="col-lg-2 col-md-3 d-flex gap-2">
                <button type="submit" class="btn btn-warning w-100 fw-semibold">
                    <i class="bi bi-funnel me-1"></i>Filter
                </button>
                <a th:if="${selectedCategory != null or searchQuery != null}"
                   th:href="@{/services}" class="btn btn-outline-secondary">Reset</a>
            </div>
        </form>
    </div>
</section>

<!-- Category Pills -->
<section class="py-3 section-dark">
    <div class="container">
        <div class="d-flex flex-wrap gap-2 justify-content-center">
            <a th:href="@{/services}"
               class="badge-pill-filter"
               th:classappend="${selectedCategory == null} ? 'active' : ''">
                All
            </a>
            <a th:each="cat : ${categories}"
               th:href="@{/services(category=${cat.id})}"
               class="badge-pill-filter"
               th:classappend="${selectedCategory != null && selectedCategory == cat.id} ? 'active' : ''"
               th:text="${cat.name}">
            </a>
        </div>
    </div>
</section>

<!-- Services Grid -->
<section class="py-5 section-dark min-vh-50">
    <div class="container">
        <!-- Empty State -->
        <div th:if="${services.isEmpty()}" class="text-center py-5">
            <i class="bi bi-search fs-1 text-muted"></i>
            <h4 class="text-white mt-3">No Services Found</h4>
            <p class="text-muted">Try adjusting your category filter or search query.</p>
            <a th:href="@{/services}" class="btn btn-outline-warning">View All Services</a>
        </div>

        <div th:if="${!services.isEmpty()}" class="row g-4">
            <div th:each="svc : ${services.content}" class="col-lg-4 col-md-6">
                <div class="service-card h-100 d-flex flex-column">
                    <div class="service-card-img-placeholder">
                        <i class="bi bi-tools fs-1 text-warning opacity-75"></i>
                    </div>
                    <div class="service-card-body flex-grow-1 d-flex flex-column">
                        <div class="d-flex justify-content-between align-items-center mb-2">
                            <span class="badge bg-warning text-dark small" th:text="${svc.category.name}">Category</span>
                            <span class="text-muted small" th:if="${svc.duration}">
                                <i class="bi bi-clock me-1"></i><span th:text="${svc.duration}"></span>
                            </span>
                        </div>
                        <h5 class="text-white mb-2" th:text="${svc.name}">Service Name</h5>
                        <p class="text-muted small flex-grow-1" th:text="${svc.description}">Description</p>
                        <div class="d-flex justify-content-between align-items-center pt-3 border-top border-secondary mt-3">
                            <span class="service-price">
                                ₹<span th:text="${#numbers.formatDecimal(svc.basePrice, 0, 'COMMA', 0, 'POINT')}">0</span>
                            </span>
                            <a th:href="@{/services/{id}(id=${svc.id})}" class="btn btn-outline-warning btn-sm">
                                View Details <i class="bi bi-arrow-right ms-1"></i>
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Pagination -->
        <nav th:if="${totalPages > 1}" class="mt-5" aria-label="Services pagination">
            <ul class="pagination justify-content-center">
                <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled' : ''">
                    <a class="page-link"
                       th:href="@{/services(page=${currentPage - 1}, category=${selectedCategory}, search=${searchQuery})}">
                        <i class="bi bi-chevron-left"></i>
                    </a>
                </li>
                <li th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
                    class="page-item" th:classappend="${i == currentPage} ? 'active' : ''">
                    <a class="page-link"
                       th:href="@{/services(page=${i}, category=${selectedCategory}, search=${searchQuery})}"
                       th:text="${i + 1}"></a>
                </li>
                <li class="page-item" th:classappend="${currentPage == totalPages - 1} ? 'disabled' : ''">
                    <a class="page-link"
                       th:href="@{/services(page=${currentPage + 1}, category=${selectedCategory}, search=${searchQuery})}">
                        <i class="bi bi-chevron-right"></i>
                    </a>
                </li>
            </ul>
        </nav>
    </div>
</section>

<!-- Footer -->
<div th:replace="~{fragments/navbar :: publicFooter}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
