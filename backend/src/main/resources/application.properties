# Spring Boot Application Properties
# =====================================
# Server Configuration
server.port=8080
server.servlet.context-path=/

# Spring Application Name
spring.application.name=car-modification-management

# =====================================
# Database Configuration
# =====================================
# Embedded H2 Database in MySQL mode:
# Runs immediately without any local database setup or password required.
# Data is persisted to ./data/carmod_db folder.
spring.datasource.url=jdbc:h2:file:./data/carmod_db;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# -------------------------------------
# To switch to MySQL 8.x:
# 1. Comment out the 6 H2 lines above
# 2. Uncomment the 4 MySQL lines below
# 3. Put your MySQL password in spring.datasource.password
# -------------------------------------
# spring.datasource.url=jdbc:mysql://localhost:3306/car_modification_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
# spring.datasource.username=${DB_USERNAME:root}
# spring.datasource.password=${DB_PASSWORD:yourpassword}
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# =====================================
# JPA / Hibernate Configuration
# =====================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true

# =====================================
# Thymeleaf Configuration
# =====================================
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.mode=HTML

# =====================================
# File Upload Configuration
# =====================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# =====================================
# Logging
# =====================================
logging.level.com.carmod=INFO
logging.level.org.springframework.security=WARN

# =====================================
# Default Admin Credentials
# =====================================
app.admin.email=admin@carmod.com
app.admin.password=Admin@1234
app.admin.name=System Administrator
